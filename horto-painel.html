<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horto — Painel de Inventário</title>
<meta name="theme-color" content="#1F3B72">
<link rel="stylesheet" href="css/tokens.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text-primary); }
  a { color: var(--accent); }

  header {
    background: var(--accent-dark); color: #fff; padding: 10px 18px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    position: sticky; top: 0; z-index: 50;
  }
  header .hl { display: flex; align-items: center; gap: 10px; }
  header .logo { width: 34px; height: 34px; border-radius: 9px; background: rgba(255,255,255,.14); display: grid; place-items: center; }
  header .ht { font-size: 15px; font-weight: 700; line-height: 1.1; }
  header .hs { font-size: 11.5px; opacity: .8; }
  header .hr { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  header .hr a { color: #fff; opacity: .85; text-decoration: none; font-size: 12.5px; }
  header .hr a:hover { opacity: 1; }
  #u-email { opacity: .85; font-size: 12.5px; }
  #u-papel { font-size: 11px; background: rgba(255,255,255,.16); padding: 3px 9px; border-radius: 20px; }
  #btn-auth { background: #fff; color: var(--accent-dark); border: none; border-radius: 20px; padding: 7px 15px; font-weight: 700; font-size: 13px; cursor: pointer; }
  #btn-auth.connected { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,.5); }

  .gate { max-width: 460px; margin: 90px auto; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 34px; text-align: center; box-shadow: var(--shadow); }
  .gate h2 { font-size: 20px; margin-bottom: 8px; }
  .gate p { color: var(--text-secondary); font-size: 14px; margin-bottom: 18px; }

  .shell { display: grid; grid-template-columns: 208px 1fr; min-height: calc(100vh - 54px); }
  .side { background: var(--surface); border-right: 1px solid var(--border); padding: 14px 10px; }
  .side .navb { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: none; padding: 10px 12px; border-radius: 9px; font-size: 14px; color: var(--text-secondary); cursor: pointer; font-weight: 600; }
  .side .navb:hover { background: var(--bg); }
  .side .navb.on { background: var(--accent-light); color: var(--accent-dark); }
  .side .navb svg { width: 18px; height: 18px; flex-shrink: 0; }
  .content { padding: 20px 24px; overflow-x: auto; }

  .view-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .view-h h2 { font-size: 19px; }
  .tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .inp, select.inp { border: 1px solid var(--border); border-radius: 8px; padding: 8px 11px; font-size: 13px; background: var(--surface); color: var(--text-primary); min-width: 180px; }
  .btn { border: 1px solid var(--border); background: var(--surface); color: var(--text-primary); border-radius: 8px; padding: 8px 13px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn:hover { border-color: var(--accent-mid); }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
  .btn-sm { padding: 6px 10px; font-size: 12.5px; }
  .lnk { background: none; border: none; color: var(--accent); font-weight: 600; cursor: pointer; font-size: 13px; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(155px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); }
  .tile .lbl { font-size: 12px; color: var(--text-secondary); font-weight: 600; }
  .tile .num { font-size: 27px; font-weight: 800; margin-top: 3px; letter-spacing: -.5px; }
  .tile .sub { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }

  .cards2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 980px) { .cards2 { grid-template-columns: 1fr; } .shell { grid-template-columns: 1fr; } .side { display: flex; flex-wrap: wrap; border-right: none; border-bottom: 1px solid var(--border); } }
  .sec { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 16px; }
  .sec h3 { font-size: 14px; margin-bottom: 12px; }

  .bars { display: flex; flex-direction: column; gap: 9px; }
  .brow { font-size: 12.5px; }
  .brow .bl { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 3px; }
  .brow .bn { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .brow .bsub { font-weight: 500; color: var(--text-secondary); font-size: 11px; font-variant-numeric: tabular-nums; }
  .brow .bv { color: var(--text-secondary); flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .track { height: 8px; background: var(--trilha); border-radius: 5px; overflow: hidden; }
  .track > span { display: block; height: 100%; border-radius: 5px; }

  /* ── CROQUI ── */
  .g-line { stroke: #EAEFF7; stroke-width: 1; vector-effect: non-scaling-stroke; }
  .g-line.m5 { stroke: #DCE5F2; }
  .cant-rect { fill: #fff; stroke: var(--accent-dark); stroke-width: 2; vector-effect: non-scaling-stroke; }
  .quad { stroke: var(--accent); stroke-width: 1.5; vector-effect: non-scaling-stroke; cursor: move; }
  .quad.sel { stroke: var(--warning); stroke-width: 2.5; }
  .quad-label { fill: var(--text-primary); font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
  .quad-sub { fill: var(--text-secondary); text-anchor: middle; dominant-baseline: middle; }
  .ruler-txt { fill: var(--text-muted); text-anchor: middle; dominant-baseline: middle; }
  .handle { fill: #fff; stroke: var(--warning); stroke-width: 1.5; vector-effect: non-scaling-stroke; cursor: nwse-resize; }
  .ghost { fill: rgba(41,78,152,.10); stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; }
  .dim-txt { fill: var(--accent-dark); font-weight: 700; text-anchor: middle; }
  .croq-grid { display: grid; grid-template-columns: 1fr 268px; gap: 16px; align-items: start; }
  @media (max-width: 980px) { .croq-grid { grid-template-columns: 1fr; } }
  .croq-stage { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 10px; }
  svg.cstage { width: 100%; height: auto; display: block; background: #FBFCFE; border: 1px solid var(--border); border-radius: 10px; touch-action: none; }
  .seg2 { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg2 button { border: 0; background: #fff; padding: 8px 11px; font-size: 12.5px; cursor: pointer; font-weight: 600; color: var(--text-secondary); }
  .seg2 button.on { background: var(--accent); color: #fff; }
  .inp2 { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; font-size: 13px; background: var(--surface); color: var(--text-primary); font-variant-numeric: tabular-nums; }
  .cql { display: block; font-size: 11.5px; color: var(--text-secondary); margin: 8px 0 3px; }
  .cq-row2 { display: flex; gap: 8px; } .cq-row2 > div { flex: 1; }
  .legend { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--text-secondary); margin-top: 10px; padding: 0 4px; }
  .legend .bar { height: 10px; flex: 1; border-radius: 5px; background: linear-gradient(90deg, #E7EDF9, #294E98); }
  .cq-leg { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; padding: 0 4px; }
  .leg-esp { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
  .leg-esp .sw, .cq-kv .sw { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; display: inline-block; }
  .cq-kv { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12.5px; padding: 5px 0; border-top: 1px solid var(--border); margin-top: 4px; }
  .cq-kv b { display: flex; align-items: center; gap: 6px; }
  .cq-hint { font-size: 11.5px; color: var(--text-muted); margin-bottom: 8px; }
  .cq-sp { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; padding: 5px 0; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .croq-status { font-size: 11.5px; color: var(--text-muted); }
  .croq-status.ok { color: var(--success); } .croq-status.err { color: var(--danger); } .croq-status.pend { color: var(--warning); }
  svg.cstage text { pointer-events: none; }
  .cmap { stroke: var(--accent-dark); stroke-width: 2; vector-effect: non-scaling-stroke; cursor: move; }
  .cmap.sel { stroke: var(--warning); stroke-width: 3; }
  .cmap-title, .cmap-num, .cmap-sub, .qmini-l { text-anchor: middle; dominant-baseline: middle; }
  .cmap-title { font-weight: 700; } .cmap-num { font-weight: 800; } .qmini-l { font-weight: 600; }
  .qmini { stroke: var(--accent); stroke-width: 1; vector-effect: non-scaling-stroke; pointer-events: none; }

  /* ── MOVIMENTAÇÕES ── */
  .mvb { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
  .mvb.ent { background: #E4F1EA; color: #166B43; }
  .mvb.sai { background: #F7EDDD; color: #8A5A1B; }
  .mvb.real { background: var(--accent-light); color: var(--accent-dark); }
  .mvb.prev { background: #fff; border: 1px dashed var(--border); color: var(--text-secondary); }
  .num.pos { color: var(--success); } .num.neg { color: var(--danger); }
  .mv-form { max-width: 640px; }
  .mv-form label { display: block; font-size: 12px; font-weight: 700; color: var(--text-secondary); margin: 12px 0 5px; }
  .mv-form input, .mv-form select, .mv-form textarea { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; font-size: 14px; background: var(--surface); color: var(--text-primary); font-family: inherit; }
  .mv-form textarea { resize: vertical; }
  .mv-form .view-h h2 { font-size: 17px; }
  .mv-hint { font-size: 12.5px; color: var(--text-secondary); margin: 8px 0 2px; min-height: 16px; }
  .mv-hint.new { color: var(--warning); }

  .tbl-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th { text-align: left; background: var(--bg); color: var(--text-secondary); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; padding: 10px 12px; position: sticky; top: 0; border-bottom: 1px solid var(--border); }
  tbody td { padding: 9px 12px; border-bottom: 1px solid var(--border); }
  tbody tr:hover { background: var(--accent-light); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .empty { padding: 26px; text-align: center; color: var(--text-muted); font-size: 13px; }

  .bk { position: fixed; inset: 0; background: rgba(20,30,24,.5); opacity: 0; pointer-events: none; transition: .2s; z-index: 60; }
  .bk.open { opacity: 1; pointer-events: auto; }
  .dw { position: fixed; top: 0; right: 0; height: 100%; width: min(440px, 100%); background: var(--bg); z-index: 61; transform: translateX(100%); transition: .22s; display: flex; flex-direction: column; box-shadow: -8px 0 30px rgba(0,0,0,.18); }
  .dw.open { transform: none; }
  .dw-h { background: var(--accent-dark); color: #fff; padding: 14px 18px; display: flex; justify-content: space-between; align-items: flex-start; }
  .dw-h .t { font-size: 16px; font-weight: 700; }
  .dw-h .s { font-size: 12px; opacity: .8; margin-top: 2px; }
  .dw-x { background: rgba(255,255,255,.15); border: none; color: #fff; width: 32px; height: 32px; border-radius: 8px; font-size: 20px; cursor: pointer; }
  .dw-b { padding: 16px 18px; overflow-y: auto; flex: 1; }
  .dw-f { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; gap: 8px; background: var(--surface); }
  .dw-b label { display: block; font-size: 12px; font-weight: 700; color: var(--text-secondary); margin: 12px 0 5px; }
  .dw-b input, .dw-b select, .dw-b textarea { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; font-size: 14px; background: var(--surface); color: var(--text-primary); font-family: inherit; }
  .dw-b textarea { resize: vertical; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .chk { display: inline-flex; align-items: center; gap: 6px; margin-right: 14px; font-size: 14px; font-weight: 500; }
  .chk input { width: auto; }
  .fotos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .fotos img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; cursor: pointer; border: 1px solid var(--border); }
  .fgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .fthumb { position: relative; }
  .fthumb img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; cursor: pointer; border: 1px solid var(--border); }
  .fdel { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 6px; border: none; background: rgba(192,57,47,.92); color: #fff; font-size: 15px; line-height: 1; cursor: pointer; }
  .dw-b label.addfoto { display: inline-flex; align-items: center; gap: 6px; margin: 10px 0 0; border: 1px dashed var(--accent-mid); color: var(--accent); border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; text-transform: none; }
  .ro { background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px; font-size: 12.5px; color: var(--text-secondary); margin-top: 12px; }

  .viz { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none; align-items: center; justify-content: center; z-index: 90; padding: 24px; }
  .viz.open { display: flex; }
  .viz img { max-width: 96vw; max-height: 92vh; border-radius: 8px; }
  .viz button { position: absolute; top: 18px; right: 22px; background: rgba(255,255,255,.15); color: #fff; border: none; width: 40px; height: 40px; border-radius: 10px; font-size: 22px; cursor: pointer; }

  #toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(120%); background: #222; color: #fff; padding: 11px 20px; border-radius: 24px; font-size: 13.5px; font-weight: 600; z-index: 100; transition: .25s; }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.success { background: var(--success); } #toast.error { background: var(--danger); }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: var(--bg); border: 1px solid var(--border); color: var(--text-secondary); }
  .idgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
  .idcard { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
  .idfotos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px; background: var(--bg); }
  .idfotos img { width: 100%; aspect-ratio: 1; object-fit: cover; cursor: pointer; }
  .idnofoto { grid-column: 1 / -1; padding: 30px 12px; text-align: center; color: var(--text-muted); font-size: 12px; }
  .idbody { padding: 12px 14px; }
  .idloc { font-size: 11.5px; color: var(--text-muted); }
  .idcur { font-size: 13.5px; font-weight: 600; margin-top: 2px; }
</style>
</head>
<body>

<header>
  <div class="hl">
    <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c0-6 3-9 8-10-1 6-4 9-8 10z"/><path d="M12 22c0-5-3-7.5-7-8.5 1 5 3.5 7.5 7 8.5z"/><path d="M12 22v-6"/></svg></div>
    <div>
      <div class="ht">Horto Municipal — Inventário</div>
      <div class="hs">SMMA Campo Largo · painel de gestão</div>
    </div>
  </div>
  <div class="hr">
    <a href="painel.html">Painel geral</a>
    <a href="painel-risco.html">🌲 Risco</a>
    <a href="index.html">App de campo</a>
    <span id="u-papel" hidden></span>
    <span id="u-email"></span>
    <button id="btn-auth" onclick="handleAuth()">Conectar</button>
  </div>
</header>

<div class="gate" id="gate">
  <h2>Painel do Horto</h2>
  <p id="gate-msg">Conecte-se com sua conta Google autorizada para gerenciar o inventário do horto.</p>
  <button class="btn btn-primary" id="gate-btn" onclick="handleAuth()">Conectar com Google</button>
</div>

<div class="shell" id="app" hidden>
  <nav class="side" id="side"></nav>
  <main class="content" id="content"></main>
</div>

<div class="bk" id="bk" onclick="fecharDrawer()"></div>
<aside class="dw" id="dw">
  <div class="dw-h"><div><div class="t" id="dw-t">—</div><div class="s" id="dw-s">—</div></div><button class="dw-x" onclick="fecharDrawer()">×</button></div>
  <div class="dw-b" id="dw-b"></div>
  <div class="dw-f" id="dw-f"></div>
</aside>

<div class="viz" id="viz" onclick="this.classList.remove('open')"><button>×</button><img id="viz-img" src="" alt="foto"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ================================================================
   HORTO — Painel de inventário (desktop / ERP)
   Mesmo backend do app de campo (Supabase). Reusa a auth do painel.
   ================================================================ */
const SUPABASE_URL = 'https://bsgkloaziukpjjzxxeja.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzZ2tsb2F6aXVrcGpqenh4ZWphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNTU4OTIsImV4cCI6MjA5OTczMTg5Mn0.Nbb_1X0soL35nFnbBMJO0lkyqlcfHq-o_AYD5hys90k';
const FOTOS_BUCKET = 'fotos-campo';
const PORTES = { pequenininha: 'Pequenininha', pequeno: 'Pequeno', medio: 'Médio', grande: 'Grande', arborizacao: 'Arborização' };
const PORTE_FAIXA = { pequenininha: '0 – 15 cm', pequeno: '15 – 35 cm', medio: '35 – 100 cm', grande: '1,0 – 1,8 m', arborizacao: '1,8 – 2,0 m' };
const PORTE_COR = { pequenininha: '#A9C1E9', pequeno: '#7E9EDB', medio: '#5680D0', grande: '#294E98', arborizacao: '#1E8659' };
const FITO = { saudavel: 'Saudável', praga: 'Praga', doenca: 'Doença', recuperacao: 'Em recuperação', morta: 'Morta / descarte' };
const MOV_MOTIVOS = {
  entrada: { producao: 'Produção própria', compra: 'Compra', doacao_receb: 'Doação recebida', transf_in: 'Transferência (entrada)' },
  saida: { plantio: 'Plantio / arborização', doacao: 'Doação', descarte: 'Morte / descarte', transf_out: 'Transferência (saída)' }
};
const FITO_COR = { saudavel: '#1E8659', praga: '#B07222', doenca: '#C0392F', recuperacao: '#5680D0', morta: '#7A1F17' };
const COR = { p: '#7E9EDB', m: '#5680D0', g: '#294E98', nat: '#1E8659', exo: '#B07222' };

let sb = null, session = null, userEmail = null, papel = null, modoAberto = false;
let CANT = [], QUAD = [], ITENS = [], CAT = [], MOV = [];
let FOTOS = { canteiro: {}, quadra: {}, item: {} };
let navAtual = 'dash';
let qById = {}, cById = {};

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16); }));
const nowIso = () => new Date().toISOString();
function showToast(msg, t) { const e = $('toast'); e.textContent = msg; e.className = t || ''; e.classList.add('show'); clearTimeout(e._h); e._h = setTimeout(() => e.classList.remove('show'), 3200); }
const thumb = v => /^https?:\/\//.test(v) ? v : 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(v) + '&sz=w200';
const full = v => /^https?:\/\//.test(v) ? v : 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(v) + '&sz=w1200';
const pode = () => modoAberto || papel === 'admin' || papel === 'editor';

/* ── auth (igual ao painel) ── */
function handleAuth() {
  if (!sb) return showToast('Biblioteca do banco não carregou.', 'error');
  if (session) { sb.auth.signOut(); return; }
  sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } });
}
function pintarAuth() {
  $('btn-auth').textContent = session ? 'Sair' : 'Conectar';
  $('btn-auth').classList.toggle('connected', !!session);
  $('u-email').textContent = userEmail || '';
  const pp = $('u-papel'), R = { admin: '👑 admin', editor: '✏️ editor', coletor: '📍 coletor', leitor: '👁 leitor' };
  if (session && (papel || modoAberto)) { pp.hidden = false; pp.textContent = modoAberto ? 'acesso livre' : (R[papel] || papel); } else pp.hidden = true;
}
async function boot() {

/* ── REST ── */
async function sbFetch(path, opts = {}) {
  if (!session) throw new Error('SEM_SESSION');
  const r = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    method: opts.method || 'GET',
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + session.access_token, 'Content-Type': 'application/json', Prefer: opts.prefer || 'return=minimal' },
    body: opts.body
  });
  if (!r.ok) { const t = await r.text().catch(() => ''); let m = t; try { const j = JSON.parse(t); m = j.message || j.hint || t; } catch (e) {} throw new Error(m || 'HTTP ' + r.status); }
  const ct = r.headers.get('content-type') || ''; if (!ct.includes('json')) return null;
  const txt = await r.text(); return txt ? JSON.parse(txt) : null;
}
const sbSelect = (t, q) => sbFetch(t + (q ? '?' + q : ''), { prefer: 'return=representation' });
const sbUpdate = (t, f, patch) => sbFetch(t + '?' + f, { method: 'PATCH', body: JSON.stringify(patch) });
const sbInsert = (t, d) => sbFetch(t, { method: 'POST', body: JSON.stringify(d) });
const sbDelete = (t, f) => sbFetch(t + '?' + f, { method: 'DELETE' });

async function carregarFotos(entidade, ids) {
  const map = {}; ids = [...new Set(ids)].filter(Boolean);
  for (let i = 0; i < ids.length; i += 60) {
    const chunk = ids.slice(i, i + 60);
    try { const fs = await sbSelect('fotos', `select=id_foto,drive_file_id,id_entidade&entidade=eq.${entidade}&id_entidade=in.(${chunk.join(',')})`) || []; fs.forEach(f => (map[f.id_entidade] = map[f.id_entidade] || []).push(f)); }
    catch (e) { console.warn('fotos', e.message); }
  }
  return map;
}

async function carregarTudo() {
  $('content').innerHTML = '<div class="empty">Carregando inventário…</div>';
  try {
    const [c, q, i, cat] = await Promise.all([
      sbSelect('horto_canteiros', 'select=*&order=criado_em.asc').then(r => r || []),
      sbSelect('horto_quadras', 'select=*&order=criado_em.asc').then(r => r || []),
      sbSelect('horto_itens', 'select=*&order=criado_em.asc').then(r => r || []),
      sbSelect('especies_catalogo', 'select=*&ativo=eq.true&order=nome_popular.asc').then(r => r || [])
    ]);
    CANT = c; QUAD = q; ITENS = i; CAT = cat;
    try { MOV = await sbSelect('horto_movimentos', 'select=*&order=data.desc,criado_em.desc').then(r => r || []); }
    catch (e) { MOV = []; /* tabela ainda não criada — rode horto_movimentos.sql */ }
    [FOTOS.canteiro, FOTOS.quadra, FOTOS.item] = await Promise.all([
      carregarFotos('horto_canteiro', c.map(x => x.id_canteiro)),
      carregarFotos('horto_quadra', q.map(x => x.id_quadra)),
      carregarFotos('horto_item', i.map(x => x.id_item))
    ]);

    render();
  } catch (e) { $('content').innerHTML = '<div class="empty">Erro ao carregar: ' + esc(e.message) + '</div>'; }
}
function computar() {
  qById = {}; cById = {};
  CANT.forEach(c => { c._quadras = 0; c._itens = 0; c._mudas = 0; c._especies = new Set(); cById[c.id_canteiro] = c; });
  QUAD.forEach(q => { q._itens = 0; q._mudas = 0; q._c = cById[q.id_canteiro]; qById[q.id_quadra] = q; if (q._c) q._c._quadras++; });
  ITENS.forEach(it => {
    const q = qById[it.id_quadra]; it._q = q; const c = q ? q._c : null; it._c = c;
    const n = +it.quantidade || 0;
    if (q) { q._itens++; q._mudas += n; }
    if (c) { c._itens++; c._mudas += n; if (it.especie_texto) c._especies.add(it.especie_texto.toLowerCase()); }
  });
}
const catByNome = () => { const m = {}; CAT.forEach(c => m[(c.nome_popular || '').toLowerCase()] = c); return m; };
function resumoEspecies() {
  const m = {};
  ITENS.forEach(it => {
    const nome = it.especie_texto || '(sem nome)'; const k = nome.toLowerCase();
    if (!m[k]) m[k] = { nome, total: 0, pequeno: 0, medio: 0, grande: 0, cant: new Set() };
    const n = +it.quantidade || 0; m[k].total += n;
    if (it.porte && m[k][it.porte] != null) m[k][it.porte] += n;
    if (it._c) m[k].cant.add(it._c.id_canteiro);
  });
  return Object.values(m).sort((a, b) => b.total - a.total);
}

function tabela(headers, rows, vazio) {
  if (!rows.length) return '<div class="tbl-wrap"><div class="empty">' + (vazio || 'Nada aqui.') + '</div></div>';

function bars(data, cor) {
  const max = Math.max(1, ...data.map(d => d.value));

}

/* ── EXPORT CSV ── */
function baixarCSV(nome, linhas) {
  const escC = v => { v = v == null ? '' : String(v); return /[";\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const txt = '﻿' + linhas.map(r => r.map(escC).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], { type: 'text/csv;charset=utf-8' }));
  a.download = nome; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function exportCanteiros() {
  const L = [['Código', 'Nome', 'Quadras', 'Itens', 'Mudas', 'Espécies', 'Lat', 'Lng', 'Obs']];
  CANT.forEach(c => L.push([c.codigo, c.nome, c._quadras, c._itens, c._mudas, c._especies.size, c.lat, c.lng, c.obs]));

}
function exportQuadras() {

}
function exportItens() {
  const byNome = catByNome();
  const L = [['Canteiro', 'Quadra', 'Espécie', 'Nome científico', 'Porte', 'Quantidade', 'Estado fitossanitário', 'Observações']];
  ITENS.forEach(it => { const cat = byNome[(it.especie_texto || '').toLowerCase()]; L.push([it._c ? (it._c.nome || it._c.codigo) : '', it._q ? (it._q.nome || it._q.codigo) : '', it.especie_texto, cat ? cat.nome_cientifico : '', PORTES[it.porte] || it.porte, it.quantidade, FITO[it.estado_fito] || '', it.obs]); });
  baixarCSV('inventario_horto.csv', L);
}
function exportResumoEspecies() {

  resumoEspecies().forEach(e => L.push([e.nome, e.total, e.pequeno, e.medio, e.grande, e.cant.size]));

  const mp = {}; resumoEspecies().forEach(e => mp[e.nome.toLowerCase()] = e.total);

  baixarCSV('catalogo_especies.csv', L);
}

/* ══════════════════════════════════════════════════════════
   CROQUI — planta do canteiro (mapa do inventário)
   Geometria (m) em horto_canteiros.croqui:
     { largura_m, comprimento_m, quadras:{ <id_quadra>:{x,y,w,h} } }
   Mudas e espécie dominante vêm do inventário (ITENS) ao vivo.
   ══════════════════════════════════════════════════════════ */
const CQ_SNAP = 0.25, CQ_MARG = 1.2, CQNS = 'http://www.w3.org/2000/svg';
const CQ_PALETA = ['#294E98','#1E8659','#B07222','#C0392F','#5680D0','#2C5D9E','#7A1F17','#7E9EDB','#A9C1E9','#6B7280'];
let croq = { cantId: null, sel: null, ferr: 'selecionar', cor: 'especie' };
let cqDrag = null, cqSaveTimer = null;
const cqSnap = v => Math.round(v / CQ_SNAP) * CQ_SNAP;
const cqClamp = (v, a, b) => Math.max(a, Math.min(b, v));
const cqRound = v => Math.round(v * 100) / 100;

function croqData(c) {
  if (!c.croqui || typeof c.croqui !== 'object') c.croqui = {};
  if (c.croqui.largura_m == null) c.croqui.largura_m = 10;
  if (c.croqui.comprimento_m == null) c.croqui.comprimento_m = 6;
  if (!c.croqui.quadras) c.croqui.quadras = {};
  return c.croqui;
}
function _rgb(cor) { if (cor[0] === '#') { const n = parseInt(cor.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; } const m = cor.match(/\d+/g); return m ? m.slice(0, 3).map(Number) : [255, 255, 255]; }
const cqTexto = cor => { const [r, g, b] = _rgb(cor); return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#1A2233' : '#fff'; };

function cqEspCanteiro(c) {
  const m = {};
  ITENS.forEach(it => { if (it._c && it._c.id_canteiro === c.id_canteiro) { const n = it.especie_texto || '(sem nome)'; m[n] = (m[n] || 0) + (+it.quantidade || 0); } });
  return Object.entries(m).sort((a, b) => b[1] - a[1]);
}
function cqCorMap(c) { const map = {}; cqEspCanteiro(c).forEach(([n], i) => map[n] = CQ_PALETA[i % CQ_PALETA.length]); return map; }
function cqDominante(idq) {
  const m = {}; ITENS.forEach(it => { if (it.id_quadra === idq) { const n = it.especie_texto || '(sem nome)'; m[n] = (m[n] || 0) + (+it.quantidade || 0); } });
  const a = Object.entries(m).sort((x, y) => y[1] - x[1]); return a.length ? a[0][0] : null;
}
function cqCorMudas(c, mudas) {
  const arr = QUAD.filter(q => q.id_canteiro === c.id_canteiro).map(q => q._mudas || 0);
  const max = Math.max(1, ...arr); const t = (mudas || 0) / max;
  const A = [231, 237, 249], B = [41, 78, 152]; const k = A.map((v, i) => Math.round(v + (B[i] - v) * t));
  return `rgb(${k[0]},${k[1]},${k[2]})`;
}
function cqFill(c, q, corMap) { if (croq.cor === 'quantidade') return cqCorMudas(c, q._mudas); const d = cqDominante(q.id_quadra); return d ? corMap[d] : '#EEF1F6'; }

function renderCroqui() {
  if (!CANT.length) { $('content').innerHTML = `<div class="view-h"><h2>Croqui do canteiro</h2></div><div class="sec"><div class="empty">Cadastre um canteiro primeiro.</div></div>`; return; }
  if (!croq.cantId || !cById[croq.cantId]) croq.cantId = CANT[0].id_canteiro;
  const c = cById[croq.cantId]; croqData(c); const editavel = pode();
  const ops = CANT.map(x => `<option value="${x.id_canteiro}" ${x.id_canteiro === croq.cantId ? 'selected' : ''}>${esc(x.nome || x.codigo || 'Canteiro')}</option>`).join('');
  $('content').innerHTML = `
    <div class="view-h"><h2>Croqui do canteiro</h2><div class="tools">
      <select class="inp" onchange="croqSelCant(this.value)">${ops}</select>
      <div class="seg2"><button class="${croq.cor === 'especie' ? 'on' : ''}" onclick="croqSetCor('especie')">Espécie</button><button class="${croq.cor === 'quantidade' ? 'on' : ''}" onclick="croqSetCor('quantidade')">Quantidade</button></div>
      ${editavel ? `<div class="seg2"><button class="${croq.ferr === 'selecionar' ? 'on' : ''}" onclick="croqSetFerr('selecionar')">👆 Selecionar</button><button class="${croq.ferr === 'desenhar' ? 'on' : ''}" onclick="croqSetFerr('desenhar')">✏️ Desenhar</button></div>` : ''}
      <span class="croq-status" id="croq-status"></span>
      <button class="btn btn-sm" onclick="croqPNG()">⬇ PNG</button>
    </div></div>
    <div class="croq-grid">
      <div class="croq-stage"><svg class="cstage" id="cstage" xmlns="${CQNS}"></svg>
        <div id="cq-legenda"></div>
      </div>
      <div class="croq-side">
        <div class="sec"><h3>Canteiro</h3>
          <div class="cq-row2">
            <div><label class="cql">Largura (m)</label><input class="inp2" id="cq-larg" type="number" step="0.5" min="1" value="${c.croqui.largura_m}" ${editavel ? '' : 'disabled'} oninput="croqDim()"></div>
            <div><label class="cql">Comprimento (m)</label><input class="inp2" id="cq-comp" type="number" step="0.5" min="1" value="${c.croqui.comprimento_m}" ${editavel ? '' : 'disabled'} oninput="croqDim()"></div>
          </div>
          ${editavel ? `<div class="cq-hint" style="margin-top:8px">Use <b>✏️ Desenhar</b> e arraste sobre o croqui para criar quadras, ou posicione as já cadastradas abaixo.</div>` : ''}
        </div>
        <div class="sec" id="cq-insp" style="display:none"></div>
        <div class="sec" id="cq-sempos" style="display:none"></div>
      </div>
    </div>`;
  cqAttach(c); cqDesenhar(c); cqLegenda(c); cqInspetor(c); cqSemPos(c);
}

function cqLegenda(c) {
  const box = $('cq-legenda'); if (!box) return;
  if (croq.cor === 'quantidade') { box.innerHTML = `<div class="legend"><span>Menos</span><div class="bar"></div><span>Mais mudas</span></div>`; return; }
  const arr = cqEspCanteiro(c).slice(0, 12); const map = cqCorMap(c);
  box.innerHTML = arr.length
    ? `<div class="cq-leg">` + arr.map(([n, t]) => `<span class="leg-esp"><span class="sw" style="background:${map[n]}"></span>${esc(n)} <b>${t}</b></span>`).join('') + `</div>`
    : `<div class="legend"><span style="color:var(--text-muted)">Sem inventário para colorir ainda — as quadras ficam cinza.</span></div>`;
}

/* desenho no SVG (metros direto no viewBox) */
function cqVB(c) { const W = c.croqui.largura_m, H = c.croqui.comprimento_m; return { x: -CQ_MARG, y: -CQ_MARG, w: W + CQ_MARG * 2, h: H + CQ_MARG * 2, W, H }; }
function cqFS(c) { return Math.max(0.28, Math.min(0.55, cqVB(c).W / 28)); }
function cqNode(tag, a, k) { const e = document.createElementNS(CQNS, tag); for (const x in a) e.setAttribute(x, a[x]); (k || []).forEach(ch => e.appendChild(ch)); return e; }
function cqTxt(x, y, s, cls, size, fill) { const t = cqNode('text', { x, y, class: cls, 'font-size': size }); if (fill) t.setAttribute('fill', fill); t.textContent = s; return t; }
function cqPonto(svg, evt) { const p = svg.createSVGPoint(); p.x = evt.clientX; p.y = evt.clientY; const m = p.matrixTransform(svg.getScreenCTM().inverse()); return { x: m.x, y: m.y }; }

function cqDesenhar(c) {
  const svg = $('cstage'); if (!svg) return; const vb = cqVB(c);
  svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  svg.setAttribute('height', Math.round(540 * vb.h / vb.w));
  svg.style.cursor = croq.ferr === 'desenhar' && pode() ? 'crosshair' : 'default';
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  const fs = cqFS(c), map = cqCorMap(c);
  for (let x = 0; x <= vb.W + .001; x++) svg.appendChild(cqNode('line', { class: 'g-line' + (x % 5 === 0 ? ' m5' : ''), x1: x, y1: 0, x2: x, y2: vb.H }));
  for (let y = 0; y <= vb.H + .001; y++) svg.appendChild(cqNode('line', { class: 'g-line' + (y % 5 === 0 ? ' m5' : ''), x1: 0, y1: y, x2: vb.W, y2: y }));
  const rs = fs * 0.8;
  for (let x = 0; x <= vb.W + .001; x += (vb.W > 20 ? 5 : 1)) svg.appendChild(cqTxt(x, -0.45, x + '', 'ruler-txt', rs));
  for (let y = 0; y <= vb.H + .001; y += (vb.H > 20 ? 5 : 1)) svg.appendChild(cqTxt(-0.55, y, y + '', 'ruler-txt', rs));
  svg.appendChild(cqNode('rect', { class: 'cant-rect', x: 0, y: 0, width: vb.W, height: vb.H }));
  QUAD.filter(q => q.id_canteiro === c.id_canteiro && c.croqui.quadras[q.id_quadra]).forEach(q => {
    const g = c.croqui.quadras[q.id_quadra]; const fill = cqFill(c, q, map); const tc = cqTexto(fill);
    const r = cqNode('rect', { class: 'quad' + (q.id_quadra === croq.sel ? ' sel' : ''), x: g.x, y: g.y, width: g.w, height: g.h, rx: 0.05, fill, 'data-id': q.id_quadra });
    const dom = cqDominante(q.id_quadra);
    const tit = cqNode('title', {}); tit.textContent = (q.nome || q.codigo || '') + (dom ? ' · ' + dom : '') + ' · ' + (q._mudas || 0) + ' mudas'; r.appendChild(tit);
    svg.appendChild(r);
    const cx = g.x + g.w / 2, cy = g.y + g.h / 2;
    svg.appendChild(cqTxt(cx, cy - fs * 0.35, q.nome || q.codigo || '—', 'quad-label', fs, tc));
    svg.appendChild(cqTxt(cx, cy + fs * 0.55, (q._mudas || 0) + ' mudas', 'quad-sub', fs * 0.72, tc));
  });
  const sel = croq.sel && c.croqui.quadras[croq.sel];
  if (sel && croq.ferr === 'selecionar' && pode()) { const hs = Math.max(0.18, fs * 0.5); svg.appendChild(cqNode('rect', { class: 'handle', x: sel.x + sel.w - hs / 2, y: sel.y + sel.h - hs / 2, width: hs, height: hs, 'data-handle': 'br' })); }
}
function cqGhost(svg, c, d) {
  const x = Math.min(d.x0, d.x1), y = Math.min(d.y0, d.y1), w = Math.abs(d.x1 - d.x0), h = Math.abs(d.y1 - d.y0);
  svg.appendChild(cqNode('rect', { class: 'ghost', x, y, width: w, height: h }));
  const fs = cqFS(c); if (w >= CQ_SNAP || h >= CQ_SNAP) svg.appendChild(cqTxt(x + w / 2, y - fs * 0.3, `${cqRound(w)} × ${cqRound(h)} m`, 'dim-txt', fs * 0.8));
}

function cqAttach(c) {
  const svg = $('cstage'); if (!svg) return;
  const W = () => c.croqui.largura_m, H = () => c.croqui.comprimento_m;
  svg.onpointerdown = e => {
    if (!pode()) return;
    const m = cqPonto(svg, e), t = e.target;
    if (croq.ferr === 'selecionar') {
      if (t.dataset && t.dataset.handle === 'br' && croq.sel) { cqDrag = { tipo: 'resize', id: croq.sel }; svg.setPointerCapture(e.pointerId); return; }
      if (t.dataset && t.dataset.id) { croq.sel = t.dataset.id; const g = c.croqui.quadras[croq.sel]; cqDrag = { tipo: 'mover', id: croq.sel, dx: m.x - g.x, dy: m.y - g.y }; svg.setPointerCapture(e.pointerId); cqDesenhar(c); cqInspetor(c); return; }
      croq.sel = null; cqDesenhar(c); cqInspetor(c); return;
    }
    const x0 = cqClamp(cqSnap(m.x), 0, W()), y0 = cqClamp(cqSnap(m.y), 0, H());
    cqDrag = { tipo: 'novo', x0, y0, x1: x0, y1: y0 }; svg.setPointerCapture(e.pointerId);
  };
  svg.onpointermove = e => {
    if (!cqDrag) return; const m = cqPonto(svg, e);
    if (cqDrag.tipo === 'novo') { cqDrag.x1 = cqClamp(cqSnap(m.x), 0, W()); cqDrag.y1 = cqClamp(cqSnap(m.y), 0, H()); cqDesenhar(c); cqGhost(svg, c, cqDrag); }
    else if (cqDrag.tipo === 'mover') { const g = c.croqui.quadras[cqDrag.id]; g.x = cqClamp(cqSnap(m.x - cqDrag.dx), 0, W() - g.w); g.y = cqClamp(cqSnap(m.y - cqDrag.dy), 0, H() - g.h); cqDesenhar(c); }
    else if (cqDrag.tipo === 'resize') { const g = c.croqui.quadras[cqDrag.id]; g.w = cqClamp(cqSnap(m.x - g.x), CQ_SNAP, W() - g.x); g.h = cqClamp(cqSnap(m.y - g.y), CQ_SNAP, H() - g.y); cqDesenhar(c); }
  };
  svg.onpointerup = () => {
    if (!cqDrag) return;
    if (cqDrag.tipo === 'novo') {
      const x = Math.min(cqDrag.x0, cqDrag.x1), y = Math.min(cqDrag.y0, cqDrag.y1), w = Math.abs(cqDrag.x1 - cqDrag.x0), h = Math.abs(cqDrag.y1 - cqDrag.y0);
      cqDrag = null; if (w >= CQ_SNAP && h >= CQ_SNAP) cqCriarQuadra(c, { x, y, w, h }); else cqDesenhar(c); return;
    }
    cqDrag = null; cqInspetor(c); cqAgendarSave(c);
  };
}

function cqInspetor(c) {
  const box = $('cq-insp'); if (!box) return;
  const q = croq.sel && qById[croq.sel];
  if (!q || q.id_canteiro !== c.id_canteiro || !c.croqui.quadras[q.id_quadra]) { box.style.display = 'none'; return; }
  const g = c.croqui.quadras[q.id_quadra], dom = cqDominante(q.id_quadra), map = cqCorMap(c), editavel = pode();
  box.style.display = 'block';
  box.innerHTML = `<h3>Quadra selecionada</h3>
    <label class="cql">Código / nome</label><input class="inp2" id="cq-cod" value="${esc(q.nome || q.codigo || '')}" ${editavel ? '' : 'disabled'}>
    <div class="cq-row2"><div><label class="cql">X (m)</label><input class="inp2" id="cq-x" type="number" step="0.25" value="${g.x}" ${editavel ? '' : 'disabled'}></div><div><label class="cql">Y (m)</label><input class="inp2" id="cq-y" type="number" step="0.25" value="${g.y}" ${editavel ? '' : 'disabled'}></div></div>
    <div class="cq-row2"><div><label class="cql">Largura (m)</label><input class="inp2" id="cq-w" type="number" step="0.25" value="${g.w}" ${editavel ? '' : 'disabled'}></div><div><label class="cql">Comprim. (m)</label><input class="inp2" id="cq-h" type="number" step="0.25" value="${g.h}" ${editavel ? '' : 'disabled'}></div></div>
    <div class="cq-kv"><span>Mudas (inventário)</span><b>${q._mudas || 0}</b></div>
    <div class="cq-kv"><span>Espécie dominante</span><b>${dom ? `<span class="sw" style="background:${map[dom]}"></span> ${esc(dom)}` : '—'}</b></div>
    <div class="cq-kv"><span>Área</span><b>${cqRound(g.w * g.h)} m²</b></div>
    ${editavel ? `<div class="btn-row"><button class="btn btn-primary btn-sm" onclick="croqAplicar()">Aplicar cotas</button><button class="btn btn-sm" onclick="croqTirar()">Tirar do croqui</button><button class="btn btn-sm" style="color:var(--danger)" onclick="croqExcluir()">Excluir quadra</button></div>` : ''}`;
}

function cqSemPos(c) {
  const box = $('cq-sempos'); if (!box) return;
  if (!pode()) { box.style.display = 'none'; return; }
  const sem = QUAD.filter(q => q.id_canteiro === c.id_canteiro && !c.croqui.quadras[q.id_quadra]);
  if (!sem.length) { box.style.display = 'none'; return; }
  box.style.display = 'block';
  box.innerHTML = `<h3>Quadras sem posição</h3><div class="cq-hint">Já cadastradas, mas ainda não estão no croqui.</div>` +
    sem.map(q => `<div class="cq-sp"><span>${esc(q.nome || q.codigo || '—')} · ${q._mudas || 0} mudas</span><button class="btn btn-sm" onclick="croqPosicionar('${q.id_quadra}')">posicionar</button></div>`).join('');
}

/* ── ações do croqui ── */
function croqSelCant(id) { croq.cantId = id; croq.sel = null; renderCroqui(); }
function croqSetCor(v) { croq.cor = v; renderCroqui(); }
function croqSetFerr(v) { croq.ferr = v; renderCroqui(); }
function cqProxCod(c) { const cods = new Set(QUAD.filter(q => q.id_canteiro === c.id_canteiro).map(q => q.codigo || q.nome || '')); let n = 1; while (cods.has('Q' + n)) n++; return 'Q' + n; }

async function cqCriarQuadra(c, g) {
  const cod = cqProxCod(c);
  const d = { id_quadra: uuid(), id_canteiro: c.id_canteiro, codigo: cod, nome: cod, obs: null, criado_em: nowIso(), criado_por: userEmail };
  QUAD.push(d); computar(); c.croqui.quadras[d.id_quadra] = g; croq.sel = d.id_quadra; croq.ferr = 'selecionar'; renderCroqui();
  try { await sbInsert('horto_quadras', d); } catch (e) { showToast('Erro ao criar quadra: ' + e.message, 'error'); }
  cqAgendarSave(c);
}
function croqPosicionar(idq) {
  const c = cById[croq.cantId]; const g = { x: 0.5, y: 0.5, w: Math.min(3, c.croqui.largura_m - 1), h: Math.min(2, c.croqui.comprimento_m - 1) };
  c.croqui.quadras[idq] = g; croq.sel = idq; croq.ferr = 'selecionar'; renderCroqui(); cqAgendarSave(c);
}
function croqAplicar() {
  const c = cById[croq.cantId], q = qById[croq.sel]; if (!q) return; const g = c.croqui.quadras[q.id_quadra]; if (!g) return;
  const novoCod = ($('cq-cod').value || '').trim();
  g.x = cqClamp(cqSnap(+$('cq-x').value || 0), 0, c.croqui.largura_m); g.y = cqClamp(cqSnap(+$('cq-y').value || 0), 0, c.croqui.comprimento_m);
  g.w = cqClamp(cqSnap(+$('cq-w').value || 1), CQ_SNAP, c.croqui.largura_m - g.x); g.h = cqClamp(cqSnap(+$('cq-h').value || 1), CQ_SNAP, c.croqui.comprimento_m - g.y);
  if (novoCod && novoCod !== (q.nome || q.codigo)) { q.codigo = novoCod; q.nome = novoCod; sbUpdate('horto_quadras', 'id_quadra=eq.' + q.id_quadra, { codigo: novoCod, nome: novoCod }).catch(e => showToast('Erro: ' + e.message, 'error')); }
  renderCroqui(); cqAgendarSave(c);
}
function croqTirar() { const c = cById[croq.cantId]; if (!croq.sel) return; delete c.croqui.quadras[croq.sel]; croq.sel = null; renderCroqui(); cqAgendarSave(c); }
async function croqExcluir() {
  const c = cById[croq.cantId], q = qById[croq.sel]; if (!q) return;
  if (!confirm(`Excluir a quadra "${q.nome || q.codigo}"?\n\nApaga também seus itens (${q._mudas || 0} muda(s)).`)) return;
  try {
    await sbDelete('horto_quadras', 'id_quadra=eq.' + q.id_quadra);
    ITENS = ITENS.filter(x => x.id_quadra !== q.id_quadra); QUAD = QUAD.filter(x => x.id_quadra !== q.id_quadra);
    delete c.croqui.quadras[q.id_quadra]; croq.sel = null; computar(); renderCroqui(); cqAgendarSave(c); showToast('Quadra excluída.', 'success');
  } catch (e) { showToast('Erro: ' + e.message, 'error'); }
}
function croqDim() {
  const c = cById[croq.cantId]; c.croqui.largura_m = Math.max(1, +$('cq-larg').value || 1); c.croqui.comprimento_m = Math.max(1, +$('cq-comp').value || 1);
  Object.values(c.croqui.quadras).forEach(g => { g.x = cqClamp(g.x, 0, c.croqui.largura_m - CQ_SNAP); g.y = cqClamp(g.y, 0, c.croqui.comprimento_m - CQ_SNAP); g.w = Math.min(g.w, c.croqui.largura_m - g.x); g.h = Math.min(g.h, c.croqui.comprimento_m - g.y); });
  cqDesenhar(c); cqAgendarSave(c);
}

function cqAgendarSave(c) { const s = $('croq-status'); if (s) { s.textContent = 'salvando…'; s.className = 'croq-status pend'; } clearTimeout(cqSaveTimer); cqSaveTimer = setTimeout(() => cqSalvar(c), 700); }
async function cqSalvar(c) {
  try { await sbUpdate('horto_canteiros', 'id_canteiro=eq.' + c.id_canteiro, { croqui: c.croqui }); const s = $('croq-status'); if (s) { s.textContent = 'salvo ✓'; s.className = 'croq-status ok'; } }
  catch (e) { const s = $('croq-status'); if (s) { s.textContent = 'não salvo'; s.className = 'croq-status err'; } showToast('Croqui não salvo: ' + e.message + (/croqui|column|schema|PGRST/i.test(e.message) ? ' — rode horto_croqui.sql no Supabase' : ''), 'error'); }
}

function croqPNG() {
  const c = cById[croq.cantId], svg = $('cstage'); if (!svg) return;
  const clone = svg.cloneNode(true); clone.setAttribute('xmlns', CQNS);
  const vb = cqVB(c), sc = 80; clone.setAttribute('width', Math.round(vb.w * sc)); clone.setAttribute('height', Math.round(vb.h * sc));
  const data = new XMLSerializer().serializeToString(clone); const img = new Image();
  img.onload = () => {
    const cv = document.createElement('canvas'); cv.width = Math.round(vb.w * sc); cv.height = Math.round(vb.h * sc);
    const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(img, 0, 0);
    cv.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = ((c.nome || c.codigo || 'croqui') + '').replace(/\s+/g, '_') + '.png'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); });
  };
  img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(data)));

/* ══════════════════════════════════════════════════════════
   MAPA DO HORTO — nível acima do croqui
   Compõe todos os canteiros num só plano. Cada canteiro é
   posicionado por croqui.pos={x,y} (m) e dimensionado pelo
   seu próprio croqui. Totais de mudas vêm do inventário.
   Botão "Mostrar quadras" abre o detalhamento por quadra.
   ══════════════════════════════════════════════════════════ */
const HM_DEF = { W: 8, H: 5 };
let hmap = { sel: null, quadras: false }, hmDrag = null, hmSaveTimer = null;
const HM_TXT = '#1A2233', HM_SUB = '#53627C';

function hmDims(c) { const cr = c.croqui; return { W: cr && cr.largura_m ? cr.largura_m : HM_DEF.W, H: cr && cr.comprimento_m ? cr.comprimento_m : HM_DEF.H }; }
function hmLerp(t) { t = Math.max(0, Math.min(1, t)); const A = [231, 237, 249], B = [41, 78, 152]; const k = A.map((v, i) => Math.round(v + (B[i] - v) * t)); return `rgb(${k[0]},${k[1]},${k[2]})`; }
function hmCorCant(mudas) { const max = Math.max(1, ...CANT.map(c => c._mudas || 0)); return hmLerp((mudas || 0) / max); }
function hmCorQuad(mudas) { const max = Math.max(1, ...QUAD.map(q => q._mudas || 0)); return hmLerp((mudas || 0) / max); }
function hmBBox() {
  const placed = CANT.filter(c => c.croqui && c.croqui.pos);
  if (!placed.length) return null;
  let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
  placed.forEach(c => { const p = c.croqui.pos, d = hmDims(c); minx = Math.min(minx, p.x); miny = Math.min(miny, p.y); maxx = Math.max(maxx, p.x + d.W); maxy = Math.max(maxy, p.y + d.H); });
  return { minx, miny, maxx, maxy };
}
function hmProxPos() {
  const placed = CANT.filter(c => c.croqui && c.croqui.pos);
  if (!placed.length) return { x: 1, y: 1 };
  const maxRight = Math.max(...placed.map(c => c.croqui.pos.x + hmDims(c).W));
  return { x: cqRound(maxRight + 2), y: 1 };
}

function renderMapa() {
  if (!CANT.length) { $('content').innerHTML = `<div class="view-h"><h2>Mapa do Horto</h2></div><div class="sec"><div class="empty">Cadastre um canteiro primeiro.</div></div>`; return; }
  CANT.forEach(c => { if (c.croqui) croqData(c); });
  const totMudas = CANT.reduce((s, c) => s + (c._mudas || 0), 0);
  $('content').innerHTML = `
    <div class="view-h"><h2>Mapa do Horto</h2><div class="tools">
      <label style="display:flex;align-items:center;gap:6px;margin:0;font-size:13px;cursor:pointer"><input type="checkbox" id="hm-quad" ${hmap.quadras ? 'checked' : ''} onchange="hmToggleQuad(this.checked)"> Mostrar quadras</label>
      <span class="croq-status" id="hm-status"></span>
      <button class="btn btn-sm" onclick="hmPNG()">⬇ PNG</button>
    </div></div>
    <div class="croq-grid">
      <div class="croq-stage"><svg class="cstage" id="hstage" xmlns="${CQNS}"></svg>
        <div class="legend"><span>Menos</span><div class="bar"></div><span>Mais mudas</span></div>
        ${pode() ? '<div class="cq-hint" style="margin-top:8px">Arraste os canteiros para posicioná-los. Duplo-clique abre o croqui do canteiro.</div>' : ''}
      </div>
      <div class="croq-side">
        <div class="sec"><h3>Totais do horto</h3>
          <div class="cq-kv"><span>Canteiros</span><b>${CANT.length}</b></div>
          <div class="cq-kv"><span>Quadras</span><b>${QUAD.length}</b></div>
          <div class="cq-kv"><span>Mudas</span><b>${totMudas.toLocaleString('pt-BR')}</b></div>
        </div>
        <div class="sec" id="hm-insp" style="display:none"></div>
        <div class="sec" id="hm-sempos" style="display:none"></div>
      </div>
    </div>`;
  hmAttach(); hmDesenhar(); hmInspetor(); hmSemPos();
}
function hmToggleQuad(v) { hmap.quadras = v; hmDesenhar(); }

function hmDesenhar() {
  const svg = $('hstage'); if (!svg) return;
  const bb = hmBBox();
  if (!bb) { svg.setAttribute('viewBox', '0 0 12 6'); svg.setAttribute('height', 300); while (svg.firstChild) svg.removeChild(svg.firstChild); svg.appendChild(cqTxt(6, 3, 'Nenhum canteiro posicionado — use “posicionar”.', 'ruler-txt', 0.45)); return; }
  const M = 2, vb = { x: bb.minx - M, y: bb.miny - M, w: (bb.maxx - bb.minx) + 2 * M, h: (bb.maxy - bb.miny) + 2 * M };
  svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  svg.setAttribute('height', Math.round(560 * vb.h / vb.w));
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  const fs = Math.max(0.3, Math.min(0.75, vb.w / 26));
  CANT.filter(c => c.croqui && c.croqui.pos).forEach(c => {
    const p = c.croqui.pos, d = hmDims(c), showQ = hmap.quadras;
    const baseFill = showQ ? '#fff' : hmCorCant(c._mudas), tc = cqTexto(baseFill);
    const r = cqNode('rect', { class: 'cmap' + (c.id_canteiro === hmap.sel ? ' sel' : ''), x: p.x, y: p.y, width: d.W, height: d.H, rx: 0.15, fill: baseFill, 'data-cid': c.id_canteiro });
    const tit = cqNode('title', {}); tit.textContent = (c.nome || c.codigo || 'Canteiro') + ' · ' + (c._mudas || 0) + ' mudas · ' + (c._quadras || 0) + ' quadra(s)'; r.appendChild(tit);
    svg.appendChild(r);
    svg.appendChild(cqTxt(p.x + d.W / 2, p.y - fs * 0.45, c.nome || c.codigo || 'Canteiro', 'cmap-title', fs * 0.72, HM_TXT));
    if (showQ) {
      QUAD.filter(q => q.id_canteiro === c.id_canteiro && c.croqui.quadras && c.croqui.quadras[q.id_quadra]).forEach(q => {
        const g = c.croqui.quadras[q.id_quadra], f = hmCorQuad(q._mudas), qtc = cqTexto(f);
        svg.appendChild(cqNode('rect', { class: 'qmini', x: p.x + g.x, y: p.y + g.y, width: g.w, height: g.h, rx: 0.05, fill: f }));
        const qcx = p.x + g.x + g.w / 2, qcy = p.y + g.y + g.h / 2;
        svg.appendChild(cqTxt(qcx, qcy - fs * 0.28, q.nome || q.codigo || '', 'qmini-l', fs * 0.48, qtc));
        svg.appendChild(cqTxt(qcx, qcy + fs * 0.36, (q._mudas || 0) + '', 'qmini-l', fs * 0.42, qtc));
      });
      svg.appendChild(cqTxt(p.x + d.W / 2, p.y + d.H - fs * 0.4, 'total ' + (c._mudas || 0) + ' mudas', 'cmap-sub', fs * 0.5, HM_SUB));
    } else {
      svg.appendChild(cqTxt(p.x + d.W / 2, p.y + d.H / 2 - fs * 0.15, (c._mudas || 0) + '', 'cmap-num', fs * 1.2, tc));
      svg.appendChild(cqTxt(p.x + d.W / 2, p.y + d.H / 2 + fs * 0.75, 'mudas', 'cmap-sub', fs * 0.5, tc));
    }
  });
}

function hmAttach() {
  const svg = $('hstage'); if (!svg) return;
  svg.onpointerdown = e => {
    const t = e.target;
    if (!(t.dataset && t.dataset.cid)) { if (pode()) { hmap.sel = null; hmDesenhar(); hmInspetor(); } return; }
    hmap.sel = t.dataset.cid; hmDesenhar(); hmInspetor();
    if (!pode()) return;
    const c = cById[t.dataset.cid]; croqData(c); const m = cqPonto(svg, e), p = c.croqui.pos;
    hmDrag = { id: c.id_canteiro, dx: m.x - p.x, dy: m.y - p.y }; svg.setPointerCapture(e.pointerId);
  };
  svg.onpointermove = e => {
    if (!hmDrag) return; const m = cqPonto(svg, e), c = cById[hmDrag.id]; croqData(c);
    c.croqui.pos.x = Math.max(0, cqSnap(m.x - hmDrag.dx)); c.croqui.pos.y = Math.max(0, cqSnap(m.y - hmDrag.dy)); hmDesenhar();
  };
  svg.onpointerup = () => { if (!hmDrag) return; const c = cById[hmDrag.id]; hmDrag = null; hmInspetor(); hmAgendarSave(c); };
  svg.ondblclick = e => { const t = e.target; if (t.dataset && t.dataset.cid) hmAbrirCroqui(t.dataset.cid); };
}

function hmInspetor() {
  const box = $('hm-insp'); if (!box) return; const c = hmap.sel && cById[hmap.sel];
  if (!c) { box.style.display = 'none'; return; }
  box.style.display = 'block';

    <div class="btn-row"><button class="btn btn-primary btn-sm" onclick="hmAbrirCroqui('${c.id_canteiro}')">Abrir croqui</button>${pode() ? `<button class="btn btn-sm" onclick="hmTirar('${c.id_canteiro}')">Tirar do mapa</button>` : ''}</div>`;
}
function hmAbrirCroqui(id) { croq.cantId = id; irPara('croqui'); }
function hmTirar(id) { const c = cById[id]; if (c.croqui) delete c.croqui.pos; hmap.sel = null; renderMapa(); hmAgendarSave(c); }

function hmSemPos() {
  const box = $('hm-sempos'); if (!box) return; if (!pode()) { box.style.display = 'none'; return; }
  const sem = CANT.filter(c => !(c.croqui && c.croqui.pos));
  if (!sem.length) { box.style.display = 'none'; return; }

  box.innerHTML = `<h3>Canteiros sem posição</h3><div class="cq-hint">Coloque no mapa para ver a totalização espacial.</div>` +
    sem.map(c => `<div class="cq-sp"><span>${esc(c.nome || c.codigo || '—')} · ${c._mudas || 0} mudas</span><button class="btn btn-sm" onclick="hmPosicionar('${c.id_canteiro}')">posicionar</button></div>`).join('');
}
function hmPosicionar(id) { const c = cById[id]; croqData(c); c.croqui.pos = hmProxPos(); hmap.sel = id; renderMapa(); hmAgendarSave(c); }

function hmAgendarSave(c) { const s = $('hm-status'); if (s) { s.textContent = 'salvando…'; s.className = 'croq-status pend'; } clearTimeout(hmSaveTimer); hmSaveTimer = setTimeout(() => hmSalvar(c), 700); }
async function hmSalvar(c) {
  try { await sbUpdate('horto_canteiros', 'id_canteiro=eq.' + c.id_canteiro, { croqui: c.croqui }); const s = $('hm-status'); if (s) { s.textContent = 'salvo ✓'; s.className = 'croq-status ok'; } }
  catch (e) { const s = $('hm-status'); if (s) { s.textContent = 'não salvo'; s.className = 'croq-status err'; } showToast('Mapa não salvo: ' + e.message + (/croqui|column|schema|PGRST/i.test(e.message) ? ' — rode horto_croqui.sql no Supabase' : ''), 'error'); }
}
function hmPNG() {
  const svg = $('hstage'); if (!svg) return; const [, , w, h] = svg.getAttribute('viewBox').split(' ').map(Number);
  const clone = svg.cloneNode(true); clone.setAttribute('xmlns', CQNS); const sc = 80; clone.setAttribute('width', Math.round(w * sc)); clone.setAttribute('height', Math.round(h * sc));
  const data = new XMLSerializer().serializeToString(clone); const img = new Image();
  img.onload = () => {
    const cv = document.createElement('canvas'); cv.width = Math.round(w * sc); cv.height = Math.round(h * sc);
    const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(img, 0, 0);
    cv.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'mapa_horto.png'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); });
  };
  img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(data)));
}

/* ══════════════════════════════════════════════════════════
   MOVIMENTAÇÕES DE MUDAS — entradas/saídas (realizadas e previstas)
   Lançadas por quadra (via id_item). Realizadas ajustam o estoque
   (horto_itens.quantidade); previstas entram só na projeção.
   ══════════════════════════════════════════════════════════ */
const hojeISO = () => new Date().toISOString().slice(0, 10);
function fmtData(d) { if (!d) return '—'; const p = ('' + d).slice(0, 10).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : d; }
const movMotivoLabel = mv => (mv.motivo && MOV_MOTIVOS[mv.tipo] && MOV_MOTIVOS[mv.tipo][mv.motivo]) || mv.motivo || '';

function acharItem(id_quadra, especie, porte) {
  const e = (especie || '').toLowerCase();
  return ITENS.find(it => it.id_quadra === id_quadra && (it.especie_texto || '').toLowerCase() === e && (it.porte || '') === (porte || ''));
}
async function acharOuCriarItem(id_quadra, especie, porte) {
  let it = acharItem(id_quadra, especie, porte); if (it) return it;
  const cat = catByNome()[(especie || '').toLowerCase()];
  const d = { id_item: uuid(), id_quadra, id_especie: cat ? cat.id_especie : null, especie_texto: especie, porte: porte || null, quantidade: 0, estado_fito: null, obs: null, criado_em: nowIso(), criado_por: userEmail };
  await sbInsert('horto_itens', d); ITENS.push(d); computar(); return d;
}
async function ajustarEstoque(it, delta) { it.quantidade = Math.max(0, (+it.quantidade || 0) + delta); await sbUpdate('horto_itens', 'id_item=eq.' + it.id_item, { quantidade: it.quantidade }); computar(); }

/* projeção: previstas por item */
function movPrevistoPorItem() {
  const m = {};
  MOV.forEach(mv => { if (mv.status !== 'previsto' || !mv.id_item) return; const k = mv.id_item; (m[k] = m[k] || { ent: 0, sai: 0 }); const n = +mv.quantidade || 0; if (mv.tipo === 'entrada') m[k].ent += n; else m[k].sai += n; });
  return m;
}

function renderMov() {
  const ops = CANT.map(c => `<option value="${c.id_canteiro}">${esc(c.nome || c.codigo || 'Canteiro')}</option>`).join('');
  $('content').innerHTML = `
    <div class="view-h"><h2>Movimentações de mudas</h2><div class="tools">
      ${pode() ? '<button class="btn btn-primary btn-sm" onclick="novaMov()">+ Movimentação</button>' : ''}
      <button class="btn btn-sm" onclick="exportMov()">⬇ CSV</button>
    </div></div>
    <div class="kpis" id="mv-kpis"></div>
    <div class="sec"><div class="tools" style="margin-bottom:12px">
      <select id="mvf-cant" class="inp" onchange="tblMov()"><option value="">Todos os canteiros</option>${ops}</select>
      <select id="mvf-tipo" class="inp" onchange="tblMov()"><option value="">Entradas e saídas</option><option value="entrada">Só entradas</option><option value="saida">Só saídas</option></select>
      <select id="mvf-status" class="inp" onchange="tblMov()"><option value="">Realizadas e previstas</option><option value="realizado">Só realizadas</option><option value="previsto">Só previstas</option></select>
      <input id="mvf-de" type="date" class="inp" title="De" onchange="tblMov()"><input id="mvf-ate" type="date" class="inp" title="Até" onchange="tblMov()">
      <input id="mvf-q" class="inp" placeholder="🔍 espécie" oninput="tblMov()">
    </div><div id="mv-tbl"></div></div>
    <div class="sec"><h3>Projeção de estoque <span style="font-weight:400;color:var(--text-muted);font-size:12px">— estoque atual ± movimentações previstas</span></h3><div id="mv-proj"></div></div>`;
  tblMov(); tblProj();
}
function tblProj() {
  const prev = movPrevistoPorItem();
  const rows = Object.keys(prev).map(idItem => {
    const it = ITENS.find(x => x.id_item === idItem); if (!it) return null;
    const qd = qById[it.id_quadra], c = qd ? qd._c : null;
    const atual = +it.quantidade || 0, pe = prev[idItem].ent, ps = prev[idItem].sai, proj = atual + pe - ps;
    return { loc: (c ? (c.nome || c.codigo || '—') : '—') + (qd ? ' › ' + (qd.nome || qd.codigo || '') : ''), esp: it.especie_texto || '—', porte: PORTES[it.porte] || it.porte || '—', atual, pe, ps, proj };
  }).filter(Boolean).sort((a, b) => a.proj - b.proj);

async function storageUpload(blob, path) {
  const r = await fetch(`${SUPABASE_URL}/storage/v1/object/${FOTOS_BUCKET}/${encodeURI(path)}`, {
    method: 'POST',
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + session.access_token, 'Content-Type': 'image/jpeg', 'x-upsert': 'true' },
    body: blob
  });
  if (!r.ok) { const t = await r.text().catch(() => ''); throw new Error('Storage: ' + (t || r.status)); }
  return `${SUPABASE_URL}/storage/v1/object/public/${FOTOS_BUCKET}/${encodeURI(path)}`;
}
async function storageDelete(path) {
  const r = await fetch(`${SUPABASE_URL}/storage/v1/object/${FOTOS_BUCKET}/${encodeURI(path)}`, {
    method: 'DELETE', headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + session.access_token }
  });
  if (!r.ok) throw new Error('storage ' + r.status);
}
function comprimirImg(file) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const MAX = 1600; let w = img.width, h = img.height;
      if (Math.max(w, h) > MAX) { const k = MAX / Math.max(w, h); w = Math.round(w * k); h = Math.round(h * k); }
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(u);
      cv.toBlob(b => b ? res(b) : rej(new Error('Falha ao processar')), 'image/jpeg', 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('Imagem inválida')); };
    img.src = u;
  });
}
const slugArq = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9._-]/g, '_');
async function addFotoP(tipo, id, input) {
  const file = input.files[0]; input.value = '';
  if (!file) return;
  showToast('Enviando foto…');
  try {
    const blob = await comprimirImg(file);
    const entidade = 'horto_' + tipo;
    const path = `${entidade}/${id}/${slugArq(entidade + '_' + id + '_' + Date.now())}.jpg`;
    const url = await storageUpload(blob, path);
    const idFoto = uuid();
    await sbInsert('fotos', { id_foto: idFoto, drive_file_id: url, web_link: url, entidade, id_entidade: id, criado_em: nowIso(), criado_por: userEmail });
    (FOTOS[tipo][id] = FOTOS[tipo][id] || []).push({ id_foto: idFoto, drive_file_id: url, id_entidade: id });
    $('dw-fotos').innerHTML = fotosInner(tipo, id);
    showToast('Foto adicionada.', 'success');
  } catch (e) { showToast('Erro na foto: ' + e.message, 'error'); }
}
async function excluirFotoP(tipo, id, idFoto) {
  if (!confirm('Excluir esta foto? Não dá para desfazer.')) return;
  const arr = (FOTOS[tipo] && FOTOS[tipo][id]) || [];
  const f = arr.find(x => String(x.id_foto) === String(idFoto));
  if (!f) return;
  try {
    await sbDelete('fotos', 'id_foto=eq.' + encodeURIComponent(idFoto));
    const marker = '/object/public/' + FOTOS_BUCKET + '/';
    const i = (f.drive_file_id || '').indexOf(marker);
    if (i >= 0) { try { await storageDelete(decodeURIComponent(f.drive_file_id.slice(i + marker.length))); } catch (e) { console.warn('storage del:', e.message); } }
    FOTOS[tipo][id] = arr.filter(x => String(x.id_foto) !== String(idFoto));
    $('dw-fotos').innerHTML = fotosInner(tipo, id);
    showToast('Foto excluída.', 'success');
  } catch (e) { showToast('Erro: ' + e.message, 'error'); }
}

  if (!confirm(`Excluir o canteiro "${c.nome || c.codigo}"?\n\nIsso apaga também suas ${c._quadras} quadra(s) e ${c._itens} item(ns).`)) return;
  try {
    await sbDelete('horto_canteiros', 'id_canteiro=eq.' + id);
    ITENS = ITENS.filter(x => !(x._c && x._c.id_canteiro === id));
    QUAD = QUAD.filter(x => x.id_canteiro !== id);
    CANT = CANT.filter(x => x.id_canteiro !== id);
    computar(); fecharDrawer(); render(); showToast('Canteiro excluído.', 'success');
  } catch (e) { showToast('Erro: ' + e.message, 'error'); }
}

/* ── QUADRA editar/novo/excluir ── */
function selCanteiro(id, sel) { return `<select id="${id}">${CANT.map(c => `<option value="${c.id_canteiro}" ${c.id_canteiro === sel ? 'selected' : ''}>${esc(c.nome || c.codigo || 'Canteiro')}</option>`).join('')}</select>`; }
function editQuadra(id) {
  const q = qById[id]; if (!q) return;
  abrirDrawer('Quadra', q._c ? (q._c.nome || q._c.codigo) : '', `
    ${fotosManager('quadra', id)}
    <label>Canteiro</label>${pode() ? selCanteiro('f-cant', q.id_canteiro) : `<input value="${esc(q._c ? (q._c.nome || q._c.codigo) : '')}" disabled>`}
    <label>Código / nome</label><input id="f-nome" value="${esc(q.nome || q.codigo || '')}" ${dis()}>
    <label>Observações</label><textarea id="f-obs" rows="3" ${dis()}>${esc(q.obs || '')}</textarea>
    <div class="ro">${q._itens} item(ns) · ${q._mudas} muda(s)</div>`,
    pode() ? `<button class="btn btn-primary" style="flex:1" onclick="salvarQuadra('${id}')">Salvar</button><button class="btn btn-danger" onclick="excluirQuadra('${id}')">Excluir</button>` : `<button class="btn" style="flex:1" onclick="fecharDrawer()">Fechar</button>`);
}
async function salvarQuadra(id) {
  const nome = val('f-nome'); const patch = { id_canteiro: val('f-cant') || qById[id].id_canteiro, codigo: nome, nome: nome, obs: val('f-obs') || null };
  try { await sbUpdate('horto_quadras', 'id_quadra=eq.' + id, patch); Object.assign(qById[id], patch); computar(); fecharDrawer(); render(); showToast('Quadra salva.', 'success'); }
  catch (e) { showToast('Erro: ' + e.message, 'error'); }
}
function novaQuadra() {
  if (!CANT.length) return showToast('Cadastre um canteiro primeiro.', 'error');
  abrirDrawer('Nova quadra', '', `
    <label>Canteiro</label>${selCanteiro('f-cant', CANT[0].id_canteiro)}
    <label>Código / nome</label><input id="f-nome" placeholder="A1">
    <label>Observações</label><textarea id="f-obs" rows="3"></textarea>`,
    `<button class="btn btn-primary" style="flex:1" onclick="criarQuadra()">Criar</button><button class="btn" onclick="fecharDrawer()">Cancelar</button>`);
}
async function criarQuadra() {
  const nome = val('f-nome'); if (!nome) return showToast('Informe o código/nome.', 'error');
  const d = { id_quadra: uuid(), id_canteiro: val('f-cant'), codigo: nome, nome: nome, obs: val('f-obs') || null, criado_em: nowIso(), criado_por: userEmail };
  try { await sbInsert('horto_quadras', d); QUAD.push(d); computar(); fecharDrawer(); render(); showToast('Quadra criada.', 'success'); }
  catch (e) { showToast('Erro: ' + e.message, 'error'); }
}
async function excluirQuadra(id) {
  const q = qById[id];
  if (!confirm(`Excluir a quadra "${q.nome || q.codigo}"?\n\nIsso apaga também seus ${q._itens} item(ns).`)) return;
  try { await sbDelete('horto_quadras', 'id_quadra=eq.' + id); ITENS = ITENS.filter(x => x.id_quadra !== id); QUAD = QUAD.filter(x => x.id_quadra !== id); computar(); fecharDrawer(); render(); showToast('Quadra excluída.', 'success'); }
  catch (e) { showToast('Erro: ' + e.message, 'error'); }
}

/* ── ITEM editar/novo/excluir ── */
function selQuadra(id, sel) {
  return `<select id="${id}">${QUAD.map(q => `<option value="${q.id_quadra}" ${q.id_quadra === sel ? 'selected' : ''}>${esc((q._c ? (q._c.nome || q._c.codigo) : '?') + ' › ' + (q.nome || q.codigo || 'quadra'))}</option>`).join('')}</select>`;
}
function selPorte(sel) { return `<select id="f-porte-e"><option value="">—</option>${Object.entries(PORTES).map(([v, l]) => `<option value="${v}" ${v === sel ? 'selected' : ''}>${l} (${PORTE_FAIXA[v]})</option>`).join('')}</select>`; }
function selFito(sel) { return `<select id="f-fito"><option value="">—</option>${Object.entries(FITO).map(([v, l]) => `<option value="${v}" ${v === sel ? 'selected' : ''}>${l}</option>`).join('')}</select>`; }
function dataListEsp() { return `<datalist id="dl-esp">${CAT.map(c => `<option value="${esc(c.nome_popular)}">`).join('')}</datalist>`; }
function editItem(id) {
  const it = ITENS.find(x => x.id_item === id); if (!it) return;
  abrirDrawer('Item de inventário', it._c ? (it._c.nome || it._c.codigo) : '', `
    ${fotosManager('item', id)}
    <label>Quadra</label>${pode() ? selQuadra('f-quad', it.id_quadra) : `<input value="${esc((it._c ? (it._c.nome || it._c.codigo) : '') + ' › ' + (it._q ? (it._q.nome || it._q.codigo) : ''))}" disabled>`}
    <label>Espécie</label><input id="f-esp" list="dl-esp" value="${esc(it.especie_texto || '')}" ${dis()}>${dataListEsp()}
    <div class="row2"><div><label>Porte</label>${selPorte(it.porte)}</div><div><label>Quantidade</label><input id="f-qtd" type="number" value="${it.quantidade != null ? it.quantidade : ''}" ${dis()}></div></div>
    <label>Estado fitossanitário</label>${selFito(it.estado_fito)}
    <label>Observações</label><textarea id="f-obs" rows="3" ${dis()}>${esc(it.obs || '')}</textarea>`,
    pode() ? `<button class="btn btn-primary" style="flex:1" onclick="salvarItem('${id}')">Salvar</button><button class="btn btn-danger" onclick="excluirItem('${id}')">Excluir</button>` : `<button class="btn" style="flex:1" onclick="fecharDrawer()">Fechar</button>`);
}
function patchItem() {
  const esp = val('f-esp'); const cat = catByNome()[esp.toLowerCase()];
  return { id_quadra: ($('f-quad') ? $('f-quad').value : undefined), especie_texto: esp || null, id_especie: cat ? cat.id_especie : null, porte: $('f-porte-e').value || null, quantidade: numOrNull('f-qtd'), estado_fito: $('f-fito').value || null, obs: val('f-obs') || null };
}
async function salvarItem(id) {
  const it = ITENS.find(x => x.id_item === id); const patch = patchItem();
  try { await sbUpdate('horto_itens', 'id_item=eq.' + id, patch); Object.assign(it, patch); computar(); fecharDrawer(); render(); showToast('Item salvo.', 'success'); }
  catch (e) { showToast('Erro: ' + e.message, 'error'); }
}
function novoItem() {
  if (!QUAD.length) return showToast('Cadastre uma quadra primeiro.', 'error');
  abrirDrawer('Novo item', '', `
    <label>Quadra</label>${selQuadra('f-quad', QUAD[0].id_quadra)}
    <label>Espécie</label><input id="f-esp" list="dl-esp" placeholder="Nome da espécie">${dataListEsp()}
    <div class="row2"><div><label>Porte</label>${selPorte('')}</div><div><label>Quantidade</label><input id="f-qtd" type="number"></div></div>
    <label>Estado fitossanitário</label>${selFito('')}
    <label>Observações</label><textarea id="f-obs" rows="3"></textarea>`,
    `<button class="btn btn-primary" style="flex:1" onclick="criarItem()">Criar</button><button class="btn" onclick="fecharDrawer()">Cancelar</button>`);
}
async function criarItem() {
  const esp = val('f-esp'); if (!esp) return showToast('Informe a espécie.', 'error');
  const cat = catByNome()[esp.toLowerCase()];
  const d = { id_item: uuid(), id_quadra: $('f-quad').value, especie_texto: esp, id_especie: cat ? cat.id_especie : null, porte: $('f-porte-e').value || null, quantidade: numOrNull('f-qtd'), estado_fito: $('f-fito').value || null, obs: val('f-obs') || null, criado_em: nowIso(), criado_por: userEmail };
  try { await sbInsert('horto_itens', d); ITENS.push(d); computar(); fecharDrawer(); render(); showToast('Item criado.', 'success'); }
  catch (e) { showToast('Erro: ' + e.message, 'error'); }
}
async function excluirItem(id) {
  if (!confirm('Excluir este item do inventário?')) return;
  try { await sbDelete('horto_itens', 'id_item=eq.' + id); ITENS = ITENS.filter(x => x.id_item !== id); computar(); fecharDrawer(); render(); showToast('Item excluído.', 'success'); }
  catch (e) { showToast('Erro: ' + e.message, 'error'); }
}

/* ── ESPÉCIE editar/novo ── */
function selUnico(id, opcoes, sel) { return `<select id="${id}"><option value="">—</option>${opcoes.map(([v, l]) => `<option value="${v}" ${v === sel ? 'selected' : ''}>${l}</option>`).join('')}</select>`; }
function formEspecie(c) {
  c = c || {};
  const fr = (c.fruto || '').split(',');
  return `
    <label>Nome popular *</label><input id="f-np" value="${esc(c.nome_popular || '')}">
    <label>Nome científico</label><input id="f-nc" value="${esc(c.nome_cientifico || '')}">
    <div class="row2">
      <div><label>Classificação</label>${selUnico('f-cl', [['frutifera', 'Frutífera'], ['ornamental', 'Ornamental']], c.classificacao)}</div>
      <div><label>Origem</label>${selUnico('f-or', [['nativa', 'Nativa'], ['exotica', 'Exótica']], c.origem)}</div>
    </div>
    <label>Fruto</label>
    <div><label class="chk"><input type="checkbox" id="f-fc" ${fr.includes('comestivel') ? 'checked' : ''}> Comestível</label>
      <label class="chk"><input type="checkbox" id="f-ff" ${fr.includes('fauna') ? 'checked' : ''}> De fauna</label></div>
    <label>Ornamental</label>${selUnico('f-ornam', [['sim', 'Sim'], ['nao', 'Não']], c.ornamental === true ? 'sim' : c.ornamental === false ? 'nao' : '')}
    <div class="row2"><div><label>Tipo</label><input id="f-tipo" value="${esc(c.tipo || '')}"></div><div><label>Floração</label><input id="f-flor" value="${esc(c.floracao || '')}"></div></div>
    <div class="row2"><div><label>Tipo de copa</label><input id="f-copa" value="${esc(c.tipo_copa || '')}"></div><div><label>Persistência</label><input id="f-pers" value="${esc(c.persistencia || '')}"></div></div>
    <label>Crescimento</label><input id="f-cres" value="${esc(c.crescimento || '')}">`;
}
function coletaEspecie() {
  const fr = []; if ($('f-fc').checked) fr.push('comestivel'); if ($('f-ff').checked) fr.push('fauna');
  const orn = $('f-ornam').value;
  return {
    nome_popular: val('f-np') || null, nome_cientifico: val('f-nc') || null,
    classificacao: $('f-cl').value || null, origem: $('f-or').value || null,
    fruto: fr.length ? fr.join(',') : null, ornamental: orn === 'sim' ? true : orn === 'nao' ? false : null,
    tipo: val('f-tipo') || null, floracao: val('f-flor') || null, tipo_copa: val('f-copa') || null,
    persistencia: val('f-pers') || null, crescimento: val('f-cres') || null
  };
}
function editEspecie(id) {
  const c = CAT.find(x => String(x.id_especie) === String(id)); if (!c) return;
  const mudas = (window._mudasPorEsp && window._mudasPorEsp[(c.nome_popular || '').toLowerCase()]) || 0;
  abrirDrawer('Espécie', c.nome_popular || '', formEspecie(c) + `<div class="ro">${mudas} muda(s) no inventário</div>`,
    pode() ? `<button class="btn btn-primary" style="flex:1" onclick="salvarEspecie('${id}')">Salvar</button><button class="btn btn-danger" onclick="excluirEspecie('${id}')">Excluir</button>` : `<button class="btn" style="flex:1" onclick="fecharDrawer()">Fechar</button>`);
}
async function salvarEspecie(id) {
  const patch = coletaEspecie(); if (!patch.nome_popular) return showToast('Informe o nome popular.', 'error');
  try { await sbUpdate('especies_catalogo', 'id_especie=eq.' + id, patch); const c = CAT.find(x => String(x.id_especie) === String(id)); Object.assign(c, patch); fecharDrawer(); render(); showToast('Espécie salva.', 'success'); }
  catch (e) { showToast('Erro: ' + e.message, 'error'); }
}
function novaEspecie() { abrirDrawer('Nova espécie', '', formEspecie(null), `<button class="btn btn-primary" style="flex:1" onclick="criarEspecie()">Criar</button><button class="btn" onclick="fecharDrawer()">Cancelar</button>`); }
async function criarEspecie() {
  const d = coletaEspecie(); if (!d.nome_popular) return showToast('Informe o nome popular.', 'error');
  d.id_especie = uuid(); d.ativo = true; d.uso = ['arborizacao', 'jardinagem', 'horto'];
  try { await sbInsert('especies_catalogo', d); CAT.push(d); CAT.sort((a, b) => (a.nome_popular || '').localeCompare(b.nome_popular || '')); fecharDrawer(); render(); showToast('Espécie criada.', 'success'); }
  catch (e) { showToast('Erro: ' + e.message, 'error'); }
}
async function excluirEspecie(id) {
  if (!confirm('Excluir esta espécie do catálogo?')) return;
  try { await sbDelete('especies_catalogo', 'id_especie=eq.' + id); CAT = CAT.filter(x => String(x.id_especie) !== String(id)); fecharDrawer(); render(); showToast('Espécie excluída.', 'success'); }
  catch (e) { showToast('Erro: ' + e.message, 'error'); }
}

boot();
</script>
</body>
</html>

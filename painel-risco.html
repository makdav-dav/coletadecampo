<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Risco de árvores — Avaliações</title>
<meta name="theme-color" content="#1F3B72">
<link rel="stylesheet" href="css/tokens.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text-primary); }
  header { background: var(--accent-dark); color: #fff; padding: 12px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header .logo { width: 34px; height: 34px; border-radius: 9px; background: rgba(255,255,255,.14); display: flex; align-items: center; justify-content: center; }
  header .ht { font-size: 15px; font-weight: 700; }
  header .hs { font-size: 12px; opacity: .8; }
  header .hr { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  header .hr a { color: #fff; text-decoration: none; border: 1.5px solid rgba(255,255,255,.55); border-radius: 20px; padding: 6px 13px; font-size: 12.5px; font-weight: 700; }
  header #u-email { font-size: 12px; opacity: .85; }
  header #btn-auth { border: 1.5px solid rgba(255,255,255,.55); background: transparent; color: #fff; border-radius: 20px; padding: 6px 13px; font-size: 12.5px; font-weight: 700; cursor: pointer; }

  .gate { max-width: 460px; margin: 80px auto; text-align: center; padding: 24px; }
  .gate h2 { font-size: 20px; } .gate p { color: var(--text-secondary); }
  .btn { border: 1px solid var(--border); background: #fff; color: var(--text-primary); border-radius: 8px; padding: 8px 13px; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
  .btn:hover { background: var(--bg); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-sm { padding: 6px 10px; font-size: 12px; }

  main { max-width: 1200px; margin: 0 auto; padding: 20px 24px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); }
  .tile .lbl { font-size: 12px; color: var(--text-secondary); font-weight: 600; }
  .tile .num { font-size: 27px; font-weight: 800; margin-top: 3px; letter-spacing: -.5px; }

  .tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .inp { border: 1px solid var(--border); border-radius: 8px; padding: 8px 11px; font-size: 13px; background: var(--surface); color: var(--text-primary); min-width: 170px; }
  .grow { flex: 1; }

  .tbl-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: auto; box-shadow: var(--shadow); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .4px; color: var(--text-secondary); background: var(--bg); position: sticky; top: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: 0; }
  .empty { padding: 30px; text-align: center; color: var(--text-muted); }
  .lnk { color: var(--accent); font-weight: 700; text-decoration: none; }
  #toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(120%); background: #222; color: #fff; padding: 11px 20px; border-radius: 24px; font-size: 13.5px; font-weight: 600; z-index: 100; transition: .25s; }
  #toast.show { transform: translateX(-50%) translateY(0); } #toast.error { background: var(--danger); }
</style>
</head>
<body>

<header>
  <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17h.01"/></svg></div>
  <div>
    <div class="ht">Risco de árvores — Avaliações</div>
    <div class="hs">SMMA Campo Largo · método de Seitz (2005)</div>
  </div>
  <div class="hr">
    <a href="painel.html">Painel geral</a>
    <a href="horto-painel.html">🌱 Horto</a>
    <a href="index.html">App de campo</a>
    <span id="u-email"></span>
    <button id="btn-auth" onclick="handleAuth()">Conectar</button>
  </div>
</header>

<div class="gate" id="gate">
  <h2>Avaliações de risco de árvores</h2>
  <p id="gate-msg">Conecte-se com sua conta Google autorizada para ver as avaliações.</p>
  <button class="btn btn-primary" id="gate-btn" onclick="handleAuth()">Conectar com Google</button>
</div>

<main id="app" hidden>
  <div class="kpis" id="kpis"></div>
  <div class="tools">
    <input id="f-busca" class="inp" placeholder="🔍 espécie, endereço ou processo" oninput="render()">
    <select id="f-aval" class="inp" onchange="render()"><option value="">Todos os avaliadores</option></select>
    <input id="f-de" type="date" class="inp" title="De" onchange="render()">
    <input id="f-ate" type="date" class="inp" title="Até" onchange="render()">
    <div class="grow"></div>
    <a class="btn btn-sm" id="btn-todos" href="relatorio-risco.html" target="_blank" rel="noopener">🖨️ Relatório de todas</a>
    <button class="btn btn-sm" onclick="exportCSV()">⬇ CSV</button>
    <button class="btn btn-sm" onclick="carregar()">↻ Atualizar</button>
  </div>
  <div id="tbl"></div>
</main>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://bsgkloaziukpjjzxxeja.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzZ2tsb2F6aXVrcGpqenh4ZWphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNTU4OTIsImV4cCI6MjA5OTczMTg5Mn0.Nbb_1X0soL35nFnbBMJO0lkyqlcfHq-o_AYD5hys90k';

let sb = null, session = null, userEmail = null, papel = null, modoAberto = false;
let AVAL = [], FOTOS = {};
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtData = d => { if (!d) return '—'; const p = ('' + d).slice(0, 10).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : d; };
function showToast(m, t) { const e = $('toast'); e.textContent = m; e.className = t || ''; e.classList.add('show'); clearTimeout(e._h); e._h = setTimeout(() => e.classList.remove('show'), 3000); }

function handleAuth() { if (!sb) return; if (session) { sb.auth.signOut(); return; } sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } }); }
function pintarAuth() { $('btn-auth').textContent = session ? 'Sair' : 'Conectar'; $('u-email').textContent = userEmail || ''; }
async function boot() {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { detectSessionInUrl: true, persistSession: true, autoRefreshToken: true, flowType: 'implicit' } });
  const { data: { session: s } } = await sb.auth.getSession();
  if (s) { session = s; userEmail = s.user?.email || null; }
  sb.auth.onAuthStateChange((ev, s2) => {
    if (ev === 'SIGNED_IN' && s2) { session = s2; userEmail = s2.user?.email || null; entrar(); }
    else if (ev === 'SIGNED_OUT') { session = null; userEmail = null; sairUI(); }
  });
  if (session) entrar(); else sairUI();
}
function sairUI() { pintarAuth(); $('app').hidden = true; $('gate').style.display = ''; }
async function entrar() {
  pintarAuth(); $('gate-msg').textContent = 'Verificando acesso…'; $('gate-btn').style.display = 'none';
  try { const r = await sbSelect('usuarios_autorizados', 'select=papel&email=eq.' + encodeURIComponent(userEmail)); if (r && r.length) papel = r[0].papel; }
  catch (e) { modoAberto = true; }
  if (!modoAberto && !papel) { $('gate').style.display = ''; $('app').hidden = true; $('gate-msg').innerHTML = 'A conta <b>' + esc(userEmail) + '</b> não está autorizada.'; return; }
  $('gate').style.display = 'none'; $('app').hidden = false; carregar();
}
async function sbFetch(path, opts = {}) {
  const r = await fetch(SUPABASE_URL + '/rest/v1/' + path, { method: opts.method || 'GET', headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + session.access_token, 'Content-Type': 'application/json' } });
  if (!r.ok) { const t = await r.text().catch(() => ''); let m = t; try { m = JSON.parse(t).message || t; } catch (e) {} throw new Error(m || 'HTTP ' + r.status); }
  const txt = await r.text(); return txt ? JSON.parse(txt) : null;
}
const sbSelect = (t, q) => sbFetch(t + (q ? '?' + q : ''));

async function carregarFotos(entidade, ids) {
  const map = {}; ids = [...new Set(ids)].filter(Boolean);
  for (let i = 0; i < ids.length; i += 60) {
    const chunk = ids.slice(i, i + 60);
    try { const fs = await sbSelect('fotos', `select=drive_file_id,id_entidade&entidade=eq.${entidade}&id_entidade=in.(${chunk.join(',')})`) || []; fs.forEach(f => (map[f.id_entidade] = map[f.id_entidade] || []).push(f)); }
    catch (e) { console.warn('fotos', e.message); }
  }
  return map;
}
async function carregar() {
  $('tbl').innerHTML = '<div class="tbl-wrap"><div class="empty">Carregando…</div></div>';
  try {
    AVAL = await sbSelect('arvores_risco', 'select=*&order=criado_em.desc') || [];
    FOTOS = await carregarFotos('arvore_risco', AVAL.map(r => r.id_risco));
    // popular filtro de avaliadores
    const avals = [...new Set(AVAL.map(r => r.avaliador).filter(Boolean))].sort();
    $('f-aval').innerHTML = '<option value="">Todos os avaliadores</option>' + avals.map(a => `<option value="${esc(a)}">${esc(a)}</option>`).join('');
    render();
  } catch (e) { $('tbl').innerHTML = `<div class="tbl-wrap"><div class="empty">Erro ao carregar: ${esc(e.message)}${/arvores_risco|relation|schema/i.test(e.message) ? '<br>Rode arvores_risco.sql no Supabase.' : ''}</div></div>`; }
}
const nFotos = id => (FOTOS[id] || []).length;

function filtrado() {
  const q = ($('f-busca').value || '').toLowerCase().trim(), fa = $('f-aval').value, de = $('f-de').value, ate = $('f-ate').value;
  return AVAL.filter(r => {
    if (fa && r.avaliador !== fa) return false;
    const dt = ('' + (r.criado_em || '')).slice(0, 10);
    if (de && dt < de) return false;
    if (ate && dt > ate) return false;
    if (q && !(`${r.especie || ''} ${r.endereco || ''} ${r.n_processo || ''}`).toLowerCase().includes(q)) return false;
    return true;
  });
}
function render() {
  const rows = filtrado();
  const d30 = new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 10);
  const tile = (n, l) => `<div class="tile"><div class="lbl">${l}</div><div class="num">${n}</div></div>`;
  $('kpis').innerHTML = tile(rows.length, 'Avaliações') + tile(rows.filter(r => nFotos(r.id_risco)).length, 'Com foto') +
    tile([...new Set(rows.map(r => r.avaliador).filter(Boolean))].length, 'Avaliadores') +
    tile(rows.filter(r => ('' + (r.criado_em || '')).slice(0, 10) >= d30).length, 'Últimos 30 dias');
  const params = () => { const p = new URLSearchParams(); const q = $('f-busca').value, fa = $('f-aval').value, de = $('f-de').value, ate = $('f-ate').value; if (q) p.set('q', q); if (fa) p.set('aval', fa); if (de) p.set('de', de); if (ate) p.set('ate', ate); return p.toString(); };
  $('btn-todos').href = 'relatorio-risco.html' + (params() ? '?' + params() : '');
  if (!rows.length) { $('tbl').innerHTML = '<div class="tbl-wrap"><div class="empty">Nenhuma avaliação encontrada.</div></div>'; return; }
  $('tbl').innerHTML = `<div class="tbl-wrap"><table><thead><tr>
    <th>Data</th><th>Processo</th><th>Espécie</th><th>Endereço</th><th>Avaliador</th><th class="num">Fotos</th><th>GPS</th><th></th></tr></thead><tbody>` +
    rows.map(r => `<tr>
      <td>${esc(fmtData(r.criado_em))}</td>
      <td>${esc(r.n_processo || '—')}</td>
      <td>${esc(r.especie || '—')}</td>
      <td>${esc(r.endereco || '—')}</td>
      <td>${esc(r.avaliador || '—')}</td>
      <td class="num">${nFotos(r.id_risco)}</td>
      <td>${r.lat ? `<a class="lnk" href="https://www.google.com/maps?q=${r.lat},${r.lng}" target="_blank" rel="noopener">📍</a>` : '—'}</td>
      <td><a class="lnk" href="relatorio-risco.html?id=${encodeURIComponent(r.id_risco)}" target="_blank" rel="noopener">🖨️ Relatório</a></td>
    </tr>`).join('') + '</tbody></table></div>';
}
function exportCSV() {
  const rows = filtrado();
  const L = [['Data', 'Processo', 'Espécie', 'Avaliador', 'Endereço', 'Lat', 'Lng', 'Altura (m)', 'DAP (cm)', 'Alvos', 'Manejo', 'Fotos', 'Observações']];
  rows.forEach(r => L.push([fmtData(r.criado_em), r.n_processo || '', r.especie || '', r.avaliador || '', r.endereco || '', r.lat ?? '', r.lng ?? '', r.altura_total ?? '', r.dap ?? '', (r.alvos || []).join('; '), (r.manejo || []).join('; '), nFotos(r.id_risco), r.obs || '']));
  const csv = L.map(l => l.map(c => { const s = ('' + (c == null ? '' : c)).replace(/"/g, '""'); return /[",;\n]/.test(s) ? `"${s}"` : s; }).join(';')).join('\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'avaliacoes_risco.csv'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
boot();
</script>
</body>
</html>

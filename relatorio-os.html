<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OS Emergencial</title>
<!-- Layout copiado do modelo oficial de OS da Prefeitura (repo emitir-os:
     "04-26 - Ordem_de_Serviço-Praça da Polônia.docx"): A4, Arial 11pt,
     faixa timbrada no topo, rodapé com endereço. -->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 11pt; color: #000; background: #E5E8EE; }

  .bar { position: sticky; top: 0; z-index: 5; background: #0B2452; color: #fff; padding: 10px 18px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-family: system-ui, sans-serif; }
  .bar .t { font-weight: 700; font-size: 14px; }
  .bar .grow { flex: 1; }
  .bar a, .bar button { color: #fff; text-decoration: none; border: 1.5px solid rgba(255,255,255,.55); background: transparent; border-radius: 20px; padding: 6px 14px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
  .bar button.solid { background: #fff; color: #0B2452; border-color: #fff; }
  .msg { text-align: center; color: #53627C; padding: 40px; font-family: system-ui, sans-serif; }

  /* folha A4 na tela */
  .folha { width: 210mm; max-width: 100%; margin: 18px auto; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
  .timbre { display: block; width: 100%; }
  .rodape { margin: 0 29mm 0 27mm; padding: 6px 0 10px; border-top: 1px solid #000; text-align: center; font-size: 7pt; line-height: 1.5; }
  .pag { width: 100%; border-collapse: collapse; }
  .pag > tbody > tr > td { padding: 4mm 29mm 6mm 27mm; }
  .pag > thead, .pag > tfoot { display: none; }

  .cab { text-align: center; font-weight: bold; line-height: 1.35; }
  .cab .sec { font-size: 14pt; }
  .cab .sub { font-size: 10pt; }
  .centro { text-align: center; margin: 0; line-height: 1.5; }
  .tit-os { font-weight: bold; }
  p.just { text-align: justify; margin: 0 0 8pt; line-height: 1.4; }

  h3 { text-align: center; font-size: 11pt; font-weight: bold; margin: 14pt 0 4pt; text-transform: uppercase; }
  table.t { width: 100%; border-collapse: collapse; margin-bottom: 4pt; }
  table.t td { border: 1px solid #000; padding: 4pt 6pt; vertical-align: top; font-size: 10.5pt; }
  table.t td.k { width: 34%; font-weight: bold; }
  .sim { font-weight: bold; text-decoration: underline; }

  .fotos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6pt; margin-top: 4pt; }
  .fotos img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border: 1px solid #000; display: block; }
  .fotos-tit { font-weight: bold; font-size: 10pt; margin: 8pt 0 2pt; }

  .data-local { text-align: center; margin: 18pt 0 30pt; }
  .assin { display: grid; grid-template-columns: 1fr 1fr; gap: 20pt; text-align: center; font-size: 10pt; line-height: 1.35; }
  .assin .linha { border-top: 1px solid #000; margin: 0 6pt 4pt; }

  @media print {
    body { background: #fff; }
    .no-print { display: none !important; }
    @page { size: A4; margin: 0; }
    .folha { width: auto; margin: 0; box-shadow: none; }
    /* faixa e rodapé repetem em toda página; thead/tfoot reservam o espaço deles */
    .timbre { position: fixed; top: 0; left: 0; width: 210mm; }
    .rodape { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; }
    .pag > thead, .pag > tfoot { display: table-header-group; }
    .pag > tfoot { display: table-footer-group; }
    .pag > thead td { height: 72mm; padding: 0; }   /* faixa tem 67mm (210mm × 653/2048) */
    .pag > tfoot td { height: 18mm; padding: 0; }
    .pag > tbody > tr > td { padding: 0 29mm 0 27mm; }
    h3, table.t tr, .fotos img, .assin { break-inside: avoid; }
    h3, .fotos-tit { break-after: avoid; }
  }
</style>
</head>
<body>

<div class="bar no-print">
  <span class="t">OS Emergencial</span>
  <div class="grow"></div>
  <a href="index.html">← Voltar</a>
  <button class="solid" onclick="window.print()">🖨️ Imprimir / Salvar PDF</button>
  <button id="btn-auth" onclick="handleAuth()" style="display:none">Conectar</button>
</div>

<div id="wrap"><div class="msg" id="msg">Carregando…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://bsgkloaziukpjjzxxeja.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzZ2tsb2F6aXVrcGpqenh4ZWphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNTU4OTIsImV4cCI6MjA5OTczMTg5Mn0.Nbb_1X0soL35nFnbBMJO0lkyqlcfHq-o_AYD5hys90k';

// Dados fixos do modelo oficial — ajuste aqui quando mudar contrato/empresa/diretoria
const DOC = {
  contrato: 'CONTRATO n° 134/2026',
  empresa: 'Ecosystem Serviços Urbanos Ltda.',
  diretora: 'Deborah N. S. de Araujo Macarini',
  cargo: ['Diretora do Departamento de Produção Vegetal e Arborização', 'Secretaria Municipal de Meio Ambiente'],
  rodape: ['Av. Padre Natal Pigato, 989 · CEP 83601-630 · Campo Largo – Paraná · Tel. (41) 291-5000 · Fax (41) 3291-5195', 'www.campolargo.pr.gov.br']
};

let sb = null, session = null;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDataHora = d => { if (!d) return '—'; try { return new Date(d).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }); } catch (e) { return '—'; } };
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const dataExtenso = d => `${String(d.getDate()).padStart(2, '0')} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`;
const P = new URLSearchParams(location.search);

/* WGS84 → UTM (o modelo oficial usa coordenadas UTM) */
function utm(lat, lon) {
  const a = 6378137, f = 1 / 298.257223563, k0 = 0.9996, e2 = f * (2 - f), ep2 = e2 / (1 - e2);
  const zona = Math.floor((lon + 180) / 6) + 1;
  const l0 = ((zona - 1) * 6 - 180 + 3) * Math.PI / 180;
  const p = lat * Math.PI / 180, l = lon * Math.PI / 180;
  const N = a / Math.sqrt(1 - e2 * Math.sin(p) ** 2), T = Math.tan(p) ** 2, C = ep2 * Math.cos(p) ** 2, A = Math.cos(p) * (l - l0);
  const e4 = e2 * e2, e6 = e4 * e2;
  const M = a * ((1 - e2 / 4 - 3 * e4 / 64 - 5 * e6 / 256) * p - (3 * e2 / 8 + 3 * e4 / 32 + 45 * e6 / 1024) * Math.sin(2 * p)
    + (15 * e4 / 256 + 45 * e6 / 1024) * Math.sin(4 * p) - (35 * e6 / 3072) * Math.sin(6 * p));
  const x = k0 * N * (A + (1 - T + C) * A ** 3 / 6 + (5 - 18 * T + T * T + 72 * C - 58 * ep2) * A ** 5 / 120) + 500000;
  let y = k0 * (M + N * Math.tan(p) * (A * A / 2 + (5 - T + 9 * C + 4 * C * C) * A ** 4 / 24 + (61 - 58 * T + T * T + 600 * C - 330 * ep2) * A ** 6 / 720));
  if (lat < 0) y += 10000000;
  return { x: Math.round(x), y: Math.round(y), zona };
}

function handleAuth() { if (!sb) return; if (session) { sb.auth.signOut(); return; } sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname + location.search } }); }
async function boot() {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { detectSessionInUrl: true, persistSession: true, autoRefreshToken: true, flowType: 'implicit' } });
  const { data: { session: s } } = await sb.auth.getSession();
  if (s) session = s;
  sb.auth.onAuthStateChange((ev, s2) => { if (ev === 'SIGNED_IN' && s2) { session = s2; carregar(); } });
  if (session) carregar();
  else { $('msg').innerHTML = 'Você precisa se conectar para ver a OS.'; $('btn-auth').style.display = ''; }
}
async function sbSelect(t, q) {
  const r = await fetch(SUPABASE_URL + '/rest/v1/' + t + (q ? '?' + q : ''), { headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + session.access_token } });
  if (!r.ok) throw new Error((await r.text().catch(() => '')) || 'HTTP ' + r.status);
  const txt = await r.text(); return txt ? JSON.parse(txt) : null;
}
async function carregarFotos(id) {
  try { return await sbSelect('fotos', `select=drive_file_id&entidade=eq.os_emergencial&id_entidade=eq.${id}`) || []; }
  catch (e) { return []; }
}
async function carregar() {
  $('btn-auth').style.display = 'none';
  try {
    const id = P.get('id');
    if (!id) { $('wrap').innerHTML = '<div class="msg">OS não informada.</div>'; return; }
    const rows = await sbSelect('os_emergencial', 'select=*&id_os=eq.' + encodeURIComponent(id));
    if (!rows || !rows.length) { $('wrap').innerHTML = '<div class="msg">OS ainda não sincronizada com o servidor.<br>Aguarde alguns segundos (com internet) e <a href="javascript:location.reload()">recarregue</a>. Se persistir, confira a Fila de sincronização no app.</div>'; return; }
    const r = rows[0];
    const fotos = await carregarFotos(id);
    const antes = fotos.filter(f => /abertura/i.test(f.drive_file_id));
    const depois = fotos.filter(f => /conclusao/i.test(f.drive_file_id));
    document.title = 'OS Emergencial ' + numOS(r) + ' — ' + (r.endereco || '');
    $('wrap').innerHTML = documento(r, antes, depois);
  } catch (e) {
    $('wrap').innerHTML = `<div class="msg">Erro: ${esc(e.message)}${/os_emergencial|relation|schema/i.test(e.message) ? '<br>Rode os_emergencial.sql no Supabase.' : ''}</div>`;
  }
}

const numOS = r => (r.numero || '—') + '/' + new Date(r.aberto_em || r.criado_em).getFullYear();
const sn = v => v ? '<span class="sim">SIM</span>' : 'Não';
const linha = (k, v) => `<tr><td class="k">${k}</td><td>${v}</td></tr>`;
const imgs = fs => `<div class="fotos">${fs.map(f => `<img src="${esc(f.drive_file_id)}" alt="foto">`).join('')}</div>`;

function documento(r, antes, depois) {
  let coord = '—';
  if (r.lat != null && r.lng != null) {
    const u = utm(+r.lat, +r.lng);
    coord = `Long.: ${u.x}<br>Lat.: ${u.y}<br><small>UTM ${u.zona}S · ${(+r.lat).toFixed(6)}, ${(+r.lng).toFixed(6)}</small>`;
  }
  const situacao = [...(r.situacao || [])];
  if (r.risco_rede) situacao.push('Rede elétrica envolvida');
  const conclusao = r.concluido_em ? new Date(r.concluido_em) : new Date(r.aberto_em || Date.now());

  return `<div class="folha">
    <img class="timbre" src="timbre-campo-largo.jpg" alt="Prefeitura Municipal de Campo Largo">
    <table class="pag">
      <thead><tr><td></td></tr></thead>
      <tfoot><tr><td></td></tr></tfoot>
      <tbody><tr><td>
        <div class="cab">
          <div class="sec">SECRETARIA MUNICIPAL DE MEIO AMBIENTE</div>
          <div class="sub">SUPERINTENDÊNCIA DE PRESERVAÇÃO E SUSTENTABILIDADE AMBIENTAL</div>
          <div class="sub">DEPARTAMENTO DE PRODUÇÃO VEGETAL E ARBORIZAÇÃO</div>
          <div class="sub">DIVISÃO DO HORTO MUNICIPAL</div>
        </div>
        <br>
        <p class="centro">${esc(DOC.contrato)}</p>
        <p class="centro tit-os">ORDEM DE SERVIÇO EMERGENCIAL ${esc(numOS(r))}</p>
        <p class="centro">À ${esc(DOC.empresa)}</p>
        <br>
        <p class="just">O Município de Campo Largo, através da Secretaria Municipal de Meio Ambiente de Campo Largo (SMMA-CL), por meio do Departamento de Produção Vegetal e Arborização, manifesta-se através da presente ORDEM DE SERVIÇO EMERGENCIAL, solicitando o atendimento imediato da ocorrência descrita abaixo, fora do horário comercial, para desobstrução da via e garantia da segurança da população.</p>
        <p class="just">A empresa deverá informar quanto ao cumprimento da presente Ordem de Serviço para a fiscalização do serviço realizado, com o consequente atestado pelo(a) fiscal de contrato. Conforme especificado abaixo:</p>

        <h3>Acionamento</h3>
        <table class="t">
          ${linha('DATA/HORA DO ACIONAMENTO', esc(fmtDataHora(r.aberto_em)))}
          ${linha('QUEM ACIONOU', esc(r.quem_acionou || '—'))}
        </table>

        <h3>Ocorrência</h3>
        <table class="t">
          ${linha('LOCAL', esc(r.endereco || '—'))}
          ${linha('COORDENADAS (UTM)', coord)}
          ${linha('DESCRIÇÃO', esc(r.descricao || '—'))}
          ${linha('SITUAÇÃO', situacao.length ? esc(situacao.join('; ')) : '—')}
          ${linha('RISCO', `Vítimas: ${sn(r.risco_vitimas)} &nbsp;·&nbsp; Trânsito: ${sn(r.risco_transito)} &nbsp;·&nbsp; Fios energizados: ${sn(r.risco_rede)}`)}
        </table>
        ${r.risco_rede ? '<p class="just"><b>ATENÇÃO:</b> com rede elétrica envolvida a equipe NÃO deve atuar antes do desligamento pela concessionária (Copel).</p>' : ''}

        <h3>Atendimento</h3>
        <table class="t">
          ${linha('EQUIPE / RESPONSÁVEL', esc(r.equipe_responsavel || '—'))}
          ${linha('EQUIPAMENTOS', esc(r.equipamentos || '—'))}
          ${linha('HORA DE CONCLUSÃO', r.concluido_em ? esc(fmtDataHora(r.concluido_em)) : '—')}
        </table>

        <h3>Execução</h3>
        <table class="t">
          ${linha('SERVIÇO REALIZADO', esc(r.obs_conclusao || '—'))}
          ${linha('PENDÊNCIAS', esc(r.pendencias || '—'))}
        </table>

        ${antes.length ? `<div class="fotos-tit">Registro fotográfico — antes</div>${imgs(antes)}` : ''}
        ${depois.length ? `<div class="fotos-tit">Registro fotográfico — depois</div>${imgs(depois)}` : ''}

        <p class="data-local">Campo Largo, ${dataExtenso(conclusao)}</p>
        <div class="assin">
          <div><div class="linha"></div>${esc(r.equipe_responsavel || 'Responsável da equipe')}<br>${esc(DOC.empresa)}</div>
          <div><div class="linha"></div>${esc(DOC.diretora)}<br>${DOC.cargo.map(esc).join('<br>')}</div>
        </div>
      </td></tr></tbody>
    </table>
    <div class="rodape">${DOC.rodape.map(esc).join('<br>')}</div>
  </div>`;
}
boot();
</script>
</body>
</html>

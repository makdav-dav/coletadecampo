<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OS Emergencial</title>
<link rel="stylesheet" href="css/tokens.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #EEF1F6; color: #1A2233; }

  .bar { position: sticky; top: 0; z-index: 5; background: var(--danger); color: #fff; padding: 10px 18px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .bar .t { font-weight: 700; font-size: 14px; }
  .bar .grow { flex: 1; }
  .bar a, .bar button { color: #fff; text-decoration: none; border: 1.5px solid rgba(255,255,255,.55); background: transparent; border-radius: 20px; padding: 6px 14px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
  .bar button.solid { background: #fff; color: var(--danger); border-color: #fff; }

  .wrap { max-width: 820px; margin: 18px auto; padding: 0 16px; }
  .msg { text-align: center; color: #53627C; padding: 40px; }

  .report { background: #fff; border: 1px solid #D9E0EC; border-radius: 10px; padding: 26px 30px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(31,59,114,.1); }
  .rep-h { border-bottom: 2px solid var(--danger); padding-bottom: 10px; margin-bottom: 14px; }
  .rep-h .tit { font-size: 15px; font-weight: 800; color: var(--danger); text-transform: uppercase; letter-spacing: .3px; }
  .rep-h .sub { font-size: 12px; color: #53627C; margin-top: 2px; }
  .rep-meta { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: #53627C; margin-top: 6px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 22px; margin: 12px 0 4px; }
  .kv { font-size: 13px; padding: 3px 0; border-bottom: 1px dotted #E1E7F0; }
  .kv b { color: #53627C; font-weight: 600; }
  .kv.full { grid-column: 1 / -1; }

  h4 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .4px; color: var(--danger); margin: 18px 0 6px; border-bottom: 1px solid #D9E0EC; padding-bottom: 3px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .chip { border: 1px solid #C7D2E4; background: #F1F5FC; color: #294E98; border-radius: 20px; padding: 3px 11px; font-size: 12px; font-weight: 600; }
  .chip.alerta { border-color: #E3B6AF; background: #F9E7E5; color: var(--danger); }
  .obs { font-size: 13px; background: #F7F9FC; border: 1px solid #E1E7F0; border-radius: 8px; padding: 10px 12px; margin-top: 6px; white-space: pre-wrap; }

  .fotos-tit { font-size: 11.5px; font-weight: 700; color: #53627C; margin: 10px 0 4px; }
  .fotos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .fotos a { display: block; }
  .fotos img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 6px; border: 1px solid #D9E0EC; }

  @media print {
    body { background: #fff; }
    .no-print { display: none !important; }
    .wrap { max-width: none; margin: 0; padding: 0; }
    .report { border: 0; border-radius: 0; box-shadow: none; margin: 0; padding: 0 6mm; }
    .report + .report { page-break-before: always; }
    h4, .rep-h, .fotos a { break-inside: avoid; }
    @page { size: A4; margin: 14mm; }
  }
</style>
</head>
<body>

<div class="bar no-print">
  <span class="t">OS Emergencial</span>
  <div class="grow"></div>
  <a href="index.html">← Voltar</a>
  <button class="solid" onclick="window.print()">🖨️ Imprimir / Salvar PDF</button>
  <button id="btn-auth" onclick="handleAuth()" style="display:none">Conectar</button>
</div>

<div class="wrap" id="wrap"><div class="msg" id="msg">Carregando…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://bsgkloaziukpjjzxxeja.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzZ2tsb2F6aXVrcGpqenh4ZWphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNTU4OTIsImV4cCI6MjA5OTczMTg5Mn0.Nbb_1X0soL35nFnbBMJO0lkyqlcfHq-o_AYD5hys90k';

let sb = null, session = null, userEmail = null;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDataHora = d => { if (!d) return '—'; try { return new Date(d).toLocaleString('pt-BR'); } catch (e) { return '—'; } };
const P = new URLSearchParams(location.search);

function handleAuth() { if (!sb) return; if (session) { sb.auth.signOut(); return; } sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname + location.search } }); }
async function boot() {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { detectSessionInUrl: true, persistSession: true, autoRefreshToken: true, flowType: 'implicit' } });
  const { data: { session: s } } = await sb.auth.getSession();
  if (s) { session = s; userEmail = s.user?.email || null; }
  sb.auth.onAuthStateChange((ev, s2) => { if (ev === 'SIGNED_IN' && s2) { session = s2; userEmail = s2.user?.email; carregar(); } });
  if (session) carregar();
  else { $('msg').innerHTML = 'Você precisa se conectar para ver a OS.'; $('btn-auth').style.display = ''; }
}
async function sbSelect(t, q) {
  const r = await fetch(SUPABASE_URL + '/rest/v1/' + t + (q ? '?' + q : ''), { headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + session.access_token } });
  if (!r.ok) throw new Error((await r.text().catch(() => '')) || 'HTTP ' + r.status);
  const txt = await r.text(); return txt ? JSON.parse(txt) : null;
}
async function carregarFotos(id) {
  try {
    return await sbSelect('fotos', `select=drive_file_id&entidade=eq.os_emergencial&id_entidade=eq.${id}`) || [];
  } catch (e) { return []; }
}
async function carregar() {
  $('btn-auth').style.display = 'none';
  try {
    const id = P.get('id');
    if (!id) { $('wrap').innerHTML = '<div class="msg">OS não informada.</div>'; return; }
    const rows = await sbSelect('os_emergencial', 'select=*&id_os=eq.' + encodeURIComponent(id));
    if (!rows || !rows.length) { $('wrap').innerHTML = '<div class="msg">OS ainda não sincronizada com o servidor.<br>Aguarde alguns segundos (com internet) e <a href="javascript:location.reload()">recarregue</a>. Se persistir, confira a Fila de sincronização no app.</div>'; return; }
    const r = rows[0];
    const fotos = await carregarFotos(id);
    const antes = fotos.filter(f => /abertura/i.test(f.drive_file_id));
    const depois = fotos.filter(f => /conclusao/i.test(f.drive_file_id));
    document.title = 'OS Emergencial — ' + (r.endereco || id.slice(0, 8));
    $('wrap').innerHTML = relatorio(r, antes, depois);
  } catch (e) {
    $('wrap').innerHTML = `<div class="msg">Erro: ${esc(e.message)}${/os_emergencial|relation|schema/i.test(e.message) ? '<br>Rode os_emergencial.sql no Supabase.' : ''}</div>`;
  }
}

function relatorio(r, antes, depois) {
  const nOS = 'OS-' + r.id_os.slice(0, 8).toUpperCase();
  const coord = r.lat ? `${(+r.lat).toFixed(6)}, ${(+r.lng).toFixed(6)}` : '—';
  const situacao = [...(r.situacao || [])];
  if (r.risco_rede) situacao.push('Rede elétrica envolvida');
  return `<div class="report">
    <div class="rep-h">
      <div class="tit">Ordem de Serviço Emergencial</div>
      <div class="sub">Queda de árvore / desobstrução de via — acionamento de plantão</div>
      <div class="rep-meta"><span>Nº: <b>${esc(nOS)}</b></span><span>Status: <b>${r.status === 'concluida' ? 'Concluída' : 'Aberta'}</b></span></div>
    </div>

    <h4>Cabeçalho</h4>
    <div class="grid2">
      <div class="kv"><b>Data/hora do acionamento:</b> ${esc(fmtDataHora(r.aberto_em))}</div>
      <div class="kv"><b>Quem acionou:</b> ${esc(r.quem_acionou || '—')}</div>
    </div>

    <h4>Ocorrência</h4>
    <div class="grid2">
      <div class="kv full"><b>Local:</b> ${esc(r.endereco || '—')}</div>
      <div class="kv"><b>Coordenadas:</b> ${esc(coord)}</div>
      <div class="kv full"><b>Descrição:</b> ${esc(r.descricao || '—')}</div>
    </div>
    <div class="kv" style="border:none; padding-top:6px"><b>Situação:</b></div>
    ${situacao.length ? `<div class="chips">${situacao.map(s => `<span class="chip alerta">${esc(s)}</span>`).join('')}</div>` : '<div style="font-size:12px;color:#94A0B6">Não informado.</div>'}
    <div class="kv" style="border:none; padding-top:8px"><b>Risco:</b> vítimas: ${r.risco_vitimas ? 'SIM' : 'Não'} &nbsp;·&nbsp; trânsito: ${r.risco_transito ? 'SIM' : 'Não'} &nbsp;·&nbsp; fios energizados: ${r.risco_rede ? 'SIM' : 'Não'}</div>

    <h4>Atendimento</h4>
    <div class="grid2">
      <div class="kv"><b>Equipe / responsável de plantão:</b> ${esc(r.equipe_responsavel || r.aberto_por || '—')}</div>
      <div class="kv"><b>Equipamentos:</b> ${esc(r.equipamentos || '—')}</div>
      <div class="kv"><b>Hora de acionamento:</b> ${esc(fmtDataHora(r.aberto_em))}</div>
      <div class="kv"><b>Hora de conclusão:</b> ${r.concluido_em ? esc(fmtDataHora(r.concluido_em)) : '—'}</div>
    </div>

    <h4>Execução</h4>
    <div class="kv" style="border:none"><b>Serviço realizado:</b></div>
    <div class="obs">${esc(r.obs_conclusao || 'Ainda não concluída.')}</div>
    <div class="kv" style="border:none; margin-top:8px"><b>Pendências:</b></div>
    <div class="obs">${esc(r.pendencias || '—')}</div>

    ${(antes.length || depois.length) ? `<h4>Fotos</h4>` : ''}
    ${antes.length ? `<div class="fotos-tit">ANTES (${antes.length})</div><div class="fotos">${antes.map(f => `<a href="${f.drive_file_id}" target="_blank" rel="noopener"><img src="${f.drive_file_id}" alt="foto" onerror="this.style.opacity=.2"></a>`).join('')}</div>` : ''}
    ${depois.length ? `<div class="fotos-tit" style="margin-top:10px">DEPOIS (${depois.length})</div><div class="fotos">${depois.map(f => `<a href="${f.drive_file_id}" target="_blank" rel="noopener"><img src="${f.drive_file_id}" alt="foto" onerror="this.style.opacity=.2"></a>`).join('')}</div>` : ''}
  </div>`;
}
boot();
</script>
</body>
</html>
